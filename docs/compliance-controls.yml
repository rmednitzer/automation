---
# Compliance Control and Policy Reference
#
# This file defines the internal control catalog (CTL) and ISMS policy set (POL)
# referenced throughout the automation repository. These controls and policies
# are mapped to the regulatory frameworks listed in the Regulatory Scope section
# of the README.
#
# Structure (JSON Schema, draft 2020-12):
#   docs/schemas/compliance-controls.schema.json
# Validated by scripts/validate-compliance-controls.py (structural checks
# always; full JSON-Schema validation when the optional `jsonschema` package
# is installed). See LIMITATIONS.md L6.
#
# Regulatory frameworks:
#   - NIS2 Directive (EU 2022/2555) — Art 20-23
#   - NISG 2026 (Austrian transposition) — effective 2026-10-01
#   - Cyber Resilience Act (EU 2024/2847) — Annex I
#   - GDPR (EU 2016/679) / Austrian DSG — Art 5, 25, 32
#   - ISO/IEC 27001:2022 — Annex A controls
#
# Every framework listed above MUST be cited by at least one regulatory_mapping
# entry below — the validator's framework-coverage check (rule 9) fails the
# build otherwise, so a declared-but-unmapped framework cannot ship.
#
# Citation conventions:
#   - CRA citations are to Annex I, Part I, point (2)(a)-(m) (the product
#     cybersecurity requirements), verified against EUR-Lex CELEX 32024R2847.
#   - NISG 2026 is the Austrian transposition of NIS2. Until the Austrian
#     section-level numbering is final, NISG entries reference the transposed
#     NIS2 article (the same risk-management/reporting duties in national law);
#     they are deliberately not pinned to a § number we cannot yet verify.

# ---------------------------------------------------------------------------
# Control Catalog (CTL)
# ---------------------------------------------------------------------------

controls:
  CTL-001:
    title: "Federated IAM with MFA and auditable authorization"
    description: >
      Identity and access management controls requiring multi-factor
      authentication, least-privilege authorization, and full auditability
      of access grants and revocations. Within this repository the technical
      controls deliver key-only SSH authentication, least-privilege sudo, and
      pam_faillock account lockout; multi-factor authentication itself is
      provided by the federated identity provider (IdP) and is out of scope
      for these host-level Ansible roles (L8). The roles below discharge the
      authorization, lockout, and auditability portions of this control.
    regulatory_mapping:
      - "NIS2 Art 21.2(i) — human resources security and access control"
      - "GDPR Art 32 — security of processing"
      - "ISO 27001:2022 A.5.15 — access control"
      - "ISO 27001:2022 A.8.5 — secure authentication"
      - "CRA Annex I, Part I (2)(d) — protection from unauthorised access by appropriate control mechanisms (authentication, identity and access management)"
      - "NISG 2026 — Austrian transposition of NIS2 Art 21.2(i) (access control)"
    roles:
      - ssh_hardening
      - users

  CTL-002:
    title: "Immutable evidence store with retention controls"
    description: >
      Compliance evidence (audit logs, integrity reports, incident records)
      must be stored immutably with defined retention periods. Evidence
      must support forensic investigation and regulatory audit.
    regulatory_mapping:
      - "NIS2 Art 21.2(a) — risk analysis and information system security"
      - "GDPR Art 5(2) — accountability principle"
      - "GDPR Art 32 — security of processing"
      - "ISO 27001:2022 A.8.15 — logging"
      - "CRA Annex I, Part I (2)(l) — recording and monitoring of relevant internal activity, including access to or modification of data"
      - "NISG 2026 — Austrian transposition of NIS2 Art 21.2(a) (information system security)"
    retention_tiers:
      governance: "10 years (3650 days)"
      incidents: "5 years (1825 days)"
      ci: "3 years (1095 days)"
      dr_tests: "5 years (1825 days)"
      security_audit: "1 year (365 days)"
      operational: "90 days"
    roles:
      - auditd
      - aide
      - log_forwarding
      - common
      - sre_toolchain
      - wazuh_agent
      - vector

  CTL-003:
    title: "Logging legality, minimisation, and forensic correlation"
    description: >
      All system logging must comply with data minimisation principles,
      maintain forensic correlation capability through synchronised
      timestamps, and meet legal admissibility requirements. Centralised
      collection with TLS transport is required.
    regulatory_mapping:
      - "NIS2 Art 21.2(a) — risk analysis and information system security"
      - "GDPR Art 5(1)(c) — data minimisation"
      - "GDPR Art 5(2) — accountability"
      - "ISO 27001:2022 A.8.15 — logging"
      - "ISO 27001:2022 A.8.17 — clock synchronisation"
      - "CRA Annex I, Part I (2)(l) — recording and monitoring of relevant internal activity"
      - "NISG 2026 — Austrian transposition of NIS2 Art 21.2(a) (information system security)"
    roles:
      - auditd
      - ntp
      - log_forwarding
      - common
      - vector
      - rsyslog_hardening

# ---------------------------------------------------------------------------
# ISMS Policy Set (POL)
# ---------------------------------------------------------------------------

policies:
  POL-001:
    title: "Access control policy"
    description: >
      Enforces least-privilege access, default-deny posture, key-only
      authentication for SSH, password complexity requirements, and
      account lockout after failed attempts. Root login is disabled;
      administrative access requires named accounts with sudo.
    regulatory_mapping:
      - "NIS2 Art 21.2(i) — human resources security and access control"
      - "GDPR Art 32 — security of processing"
      - "ISO 27001:2022 A.5.15 — access control"
      - "ISO 27001:2022 A.8.3 — information access restriction"
      - "CRA Annex I, Part I (2)(d) — protection from unauthorised access by appropriate control mechanisms"
      - "CRA Annex I, Part I (2)(j) — limit attack surfaces, including external interfaces"
      - "NISG 2026 — Austrian transposition of NIS2 Art 21.2(i) (access control)"
    roles:
      - ssh_hardening
      - users
      - ufw
      - apparmor
      - usbguard
      - nftables_egress
      - redfish

  POL-002:
    title: "Incident response policy"
    description: >
      Defines detection, containment, eradication, and recovery phases
      for security incidents. Requires automated detection mechanisms
      (fail2ban, AIDE, rkhunter), alerting pipelines, and timestamped
      evidence for all incident-related actions.
    regulatory_mapping:
      - "NIS2 Art 21.2(b) — incident handling"
      - "NIS2 Art 23 — reporting obligations"
      - "GDPR Art 33 — notification of personal data breach"
      - "ISO 27001:2022 A.5.24 — information security incident management"
      - "CRA Annex I, Part I (2)(k) — reduce the impact of an incident using exploitation-mitigation mechanisms"
      - "NISG 2026 — Austrian transposition of NIS2 Art 21.2(b) (incident handling) and Art 23 (reporting)"
    roles:
      - fail2ban
      - aide
      - rkhunter
      - ntp
      - log_forwarding
      - sre_toolchain
      - wazuh_agent

  POL-003:
    title: "Cryptography policy"
    description: >
      Mandates approved cryptographic algorithms and key management
      practices. Prohibits MD5 and SHA-1 for compliance purposes.
      Requires AES-256 or equivalent for symmetric encryption,
      Ed25519/ECDSA for asymmetric operations, and TLS 1.2+ for
      data in transit.
    regulatory_mapping:
      - "NIS2 Art 21.2(h) — policies on the use of cryptography"
      - "GDPR Art 32(1)(a) — encryption of personal data"
      - "ISO 27001:2022 A.8.24 — use of cryptography"
      - "CRA Annex I, Part I (2)(e) — confidentiality of data via state-of-the-art encryption at rest and in transit"
      - "NISG 2026 — Austrian transposition of NIS2 Art 21.2(h) (cryptography and encryption)"
    roles:
      - ssh_hardening
      - users
      - ntp
      - log_forwarding
      - aide
      - dns
      - vector

  POL-004:
    title: "Data classification and handling policy"
    description: >
      Establishes data classification levels (Public, Internal,
      Confidential, Restricted) and corresponding handling requirements.
      Restricted data must not leak via core dumps, swap, or temporary
      files. Full audit logging is required for Restricted data operations.
    regulatory_mapping:
      - "GDPR Art 5(1)(f) — integrity and confidentiality"
      - "GDPR Art 25 — data protection by design"
      - "ISO 27001:2022 A.5.12 — classification of information"
      - "ISO 27001:2022 A.5.13 — labelling of information"
      - "CRA Annex I, Part I (2)(g) — process only data that is adequate, relevant and limited to what is necessary (data minimisation)"
      - "CRA Annex I, Part I (2)(e) — confidentiality of processed data (no leakage via core dumps, swap, or temporary files)"
    roles:
      - common
      - auditd
      - systemd_hardening
      - kernel_lockdown
      - ollama

  POL-005:
    title: "Change management policy"
    description: >
      Requires all infrastructure changes to be tracked, authorised,
      and auditable. Scheduled tasks (cron) and configuration changes
      must be logged. Changes to critical system files trigger audit
      events.
    regulatory_mapping:
      - "NIS2 Art 21.2(e) — security in network and information systems"
      - "ISO 27001:2022 A.8.32 — change management"
      - "CRA Annex I, Part I (2)(l) — recording and monitoring of modifications to data, services, or configuration"
      - "NISG 2026 — Austrian transposition of NIS2 Art 21.2(e) (security in acquisition, development and maintenance)"
    roles:
      - auditd
