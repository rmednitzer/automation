---
name: AI Compliance Review

# Advisory, AI-assisted compliance review of a PR's role headers vs. the control
# catalog, run on a LOCAL inference endpoint so diffs never leave the estate
# (POL-004 / ADR-006). Non-blocking; the deterministic compliance validator in
# the CI workflow remains the authoritative gate.

on:
  pull_request:
    branches:
      - main
    paths:
      - "roles/**"
      - "playbooks/**"
      - "docs/compliance-controls.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI compliance review (advisory)
    # Runs only when a local inference endpoint is configured (repository or org
    # variable). Use a self-hosted runner with access to the endpoint so diffs
    # stay on-prem (ADR-006). Dormant — and never blocking — otherwise.
    if: ${{ vars.AI_REVIEW_OLLAMA_ENDPOINT != '' }}
    runs-on: ${{ vars.AI_REVIEW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Run advisory AI compliance review (local inference)
        continue-on-error: true
        env:
          OLLAMA_ENDPOINT: ${{ vars.AI_REVIEW_OLLAMA_ENDPOINT }}
          OLLAMA_MODEL: ${{ vars.AI_REVIEW_OLLAMA_MODEL || 'llama3.1:8b' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ai-compliance-review.py
