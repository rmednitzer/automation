---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Galaxy collections
        run: ansible-galaxy install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Galaxy dependencies
        run: ansible-galaxy install -r requirements.yml

      - name: Syntax check playbooks
        run: |
          for playbook in playbooks/*.yml; do
            echo "Checking ${playbook}..."
            ansible-playbook "${playbook}" --syntax-check
          done

  validate-compliance:
    name: Validate compliance-controls.yml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate schema and role references
        run: python3 scripts/validate-compliance-controls.py

  pre-commit:
    name: Pre-commit (hygiene + EditorConfig)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # yamllint and ansible-lint already run in the `lint` job above;
      # skip them here so this job stays fast and doesn't double-report.
      - name: Run hygiene hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: yamllint,ansible-lint
