---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded in-flight runs for the same ref (matches companion repos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Galaxy collections
        run: ansible-galaxy install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Galaxy dependencies
        run: ansible-galaxy install -r requirements.yml

      - name: Syntax check playbooks
        run: |
          for playbook in playbooks/*.yml; do
            echo "Checking ${playbook}..."
            ansible-playbook "${playbook}" --syntax-check
          done

  validate-compliance:
    name: Validate compliance-controls.yml
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate schema and role references
        run: python3 scripts/validate-compliance-controls.py

  collections-sbom:
    name: Galaxy collections SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Galaxy collections
        run: ansible-galaxy install -r requirements.yml

      - name: Generate CycloneDX SBOM
        run: python3 scripts/galaxy-sbom.py > galaxy-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: galaxy-sbom-${{ github.sha }}
          path: galaxy-sbom.cdx.json
          retention-days: 90

  molecule:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Roles that ship a molecule/default scenario. Add roles here as
        # scenarios land (LIMITATIONS.md L2/L3/L5).
        role:
          - users

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ansible, Molecule, and the Docker driver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "molecule>=6" "molecule-plugins[docker]" docker

      - name: Install Galaxy collections
        # ansible.cfg pins collections_path to the repo-root collections/ dir,
        # so this installs there.
        run: ansible-galaxy install -r requirements.yml

      - name: Run molecule test
        working-directory: roles/${{ matrix.role }}
        env:
          # molecule runs from roles/<role>, where the repo-root ansible.cfg
          # (and its relative collections_path) does not apply, so Ansible
          # would not find ansible.posix / community.general. Point it at the
          # workspace collections/ dir explicitly so converge resolves modules
          # like community.general.pamd and ansible.posix.authorized_key.
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
        run: molecule test

  pre-commit:
    name: Pre-commit (hygiene + EditorConfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # yamllint and ansible-lint already run in the `lint` job above;
      # skip them here so this job stays fast and doesn't double-report.
      - name: Run hygiene hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: yamllint,ansible-lint
