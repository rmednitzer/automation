---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual trigger for the Molecule matrix (see the `molecule` job): it runs
  # systemd-in-Docker and exercises role steps that are not container-safe
  # (auditd rule loading, sshd restart, read-only sysctls), so it is run
  # on-demand against a Docker host rather than on every push/PR.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded in-flight runs for the same ref (matches companion repos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Galaxy collections
        run: ansible-galaxy install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Galaxy dependencies
        run: ansible-galaxy install -r requirements.yml

      - name: Syntax check playbooks
        run: |
          for playbook in playbooks/*.yml; do
            echo "Checking ${playbook}..."
            ansible-playbook "${playbook}" --syntax-check
          done

  validate-compliance:
    name: Validate compliance-controls.yml
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install PyYAML and jsonschema
        # requirements-dev.txt provides PyYAML (structural checks) and
        # jsonschema (so the validator also checks the file against
        # docs/schemas/compliance-controls.schema.json — L6).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate schema and role references
        run: python3 scripts/validate-compliance-controls.py

  vault-example:
    name: Vault worked example decrypts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Proves the vault convention end-to-end: the committed example
      # docs/examples/vault.yml is really ansible-vault encrypted and decrypts
      # with the documented throwaway password ("example" — it only protects
      # placeholder values). It lives under docs/examples/ rather than an
      # inventories/<env>/group_vars/ path so it does NOT auto-load on normal
      # dev runs (an encrypted group_vars/vault.yml would force every dev run
      # to supply the vault password). The password is written to a file and
      # passed via --vault-password-file, mirroring the
      # ANSIBLE_VAULT_PASSWORD_FILE convention in CLAUDE.md. Fails if the file
      # is not encrypted or the password/convention drifts.
      - name: Decrypt the worked vault example
        run: |
          pwfile="$(mktemp)"
          printf 'example' > "$pwfile"
          trap 'rm -f "$pwfile"' EXIT
          ansible-vault view \
            --vault-password-file "$pwfile" \
            docs/examples/vault.yml \
            | grep -q 'vault_smtp_user' \
            && echo "vault example decrypted OK"

  collections-sbom:
    name: Galaxy collections SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Galaxy collections
        run: ansible-galaxy install -r requirements.yml

      - name: Generate CycloneDX SBOM
        run: python3 scripts/galaxy-sbom.py > galaxy-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: galaxy-sbom-${{ github.sha }}
          path: galaxy-sbom.cdx.json
          retention-days: 90

  molecule:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    # On-demand only: these scenarios run systemd-in-Docker (geerlingguy
    # images) and exercise role steps that are NOT container-safe — auditd
    # rule loading (the audit subsystem is not namespaced), sshd restart, and
    # writing read-only/namespaced sysctls — so they cannot pass in a plain
    # container and could not be validated in the authoring environment.
    # Rather than show a perpetual red on every PR, the matrix runs only on a
    # manual `workflow_dispatch` (against a Docker host you control); converge
    # is the real gate there. To make it gate on push/PR, the roles first need
    # container-awareness (skip the non-container-safe steps under
    # ansible_virtualization_type), validated on a Docker host. See
    # LIMITATIONS.md (L2/L3/L5), ADR-004, and roles/users/README.md.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Roles that ship a molecule/default scenario (dual-OS: noble +
        # resolute). Add roles here as scenarios land (LIMITATIONS.md
        # L2/L3/L5).
        role:
          - users
          - ssh_hardening
          - auditd
          - common

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ansible, Molecule, and the Docker driver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "molecule>=6" "molecule-plugins[docker]" docker

      - name: Install Galaxy collections
        # ansible.cfg pins collections_path to the repo-root collections/ dir,
        # so this installs there.
        run: ansible-galaxy install -r requirements.yml

      - name: Run molecule test
        working-directory: roles/${{ matrix.role }}
        env:
          # molecule runs from roles/<role>, where the repo-root ansible.cfg
          # (and its relative collections_path) does not apply, so Ansible
          # would not find ansible.posix / community.general. Point it at the
          # workspace collections/ dir explicitly so converge resolves modules
          # like community.general.pamd and ansible.posix.authorized_key.
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
        run: molecule test

  pre-commit:
    name: Pre-commit (hygiene + EditorConfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # yamllint and ansible-lint already run in the `lint` job above;
      # skip them here so this job stays fast and doesn't double-report.
      - name: Run hygiene hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: yamllint,ansible-lint
