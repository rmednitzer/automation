---
# AppArmor (MAC / LSM): ensure installed + active, audit profile coverage, and
# optionally move opted-in profiles to complain/enforce mode. POL-001.

- name: Configure AppArmor (MAC)
  when: apparmor_enabled | bool
  block:
    # Only a container GUEST skips runtime management (the host kernel owns the
    # AppArmor policy there and apparmorfs is not writable); a container/LXC
    # *host* is managed normally. Packages are installed regardless.
    - name: Determine whether to manage the AppArmor runtime
      ansible.builtin.set_fact:
        apparmor_runtime_managed: >-
          {{ apparmor_manage_runtime | bool
             and not ((ansible_virtualization_type | default('')) in ['docker', 'podman', 'container', 'containerd', 'lxc', 'systemd-nspawn']
                      and (ansible_virtualization_role | default('host')) == 'guest') }}

    # aa-enforce/aa-complain take a top-level profile or executable path. A
    # loaded-profile name from aa-status that is a child/hat profile (contains
    # '//') is not a valid argument, so reject it up front with guidance rather
    # than letting the change silently no-op. Gated on apparmor_runtime_managed:
    # validation fires only where the mode changes are actually attempted, so an
    # unmanaged/container-guest host keeps the documented skip behaviour and is
    # not failed for a profile it would never touch (managed hosts still catch
    # the bad value).
    - name: Assert opted-in profile names are top-level (not hat/child profiles)
      ansible.builtin.assert:
        that:
          - "'//' not in item"
        fail_msg: >-
          AppArmor profile '{{ item }}' looks like a child/hat profile (contains
          '//'); aa-enforce/aa-complain act on a top-level profile or the
          executable path. List the parent profile or executable instead.
        quiet: true
      loop: "{{ apparmor_complain_profiles + apparmor_enforce_profiles }}"
      loop_control:
        label: "{{ item }}"
      when: apparmor_runtime_managed | bool

    - name: Install AppArmor packages
      ansible.builtin.apt:
        name: "{{ apparmor_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true
      notify: Reload AppArmor

    - name: Install the distribution AppArmor profile sets
      ansible.builtin.apt:
        name:
          - apparmor-profiles
          - apparmor-profiles-extra
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true
      when: apparmor_install_extra_profiles | bool
      notify: Reload AppArmor

    - name: Enable and start AppArmor
      ansible.builtin.systemd_service:
        name: apparmor
        enabled: true
        state: started
      become: true
      when: apparmor_runtime_managed | bool

    # Decide whether AppArmor is actually active from apparmorfs, BEFORE any
    # reload. This is independent of the apparmor.service and apparmor-utils:
    # /sys/kernel/security/apparmor/ exists iff the LSM is enabled in the
    # kernel. Doing it first means a disabled host is diagnosed (or explicitly
    # allowed) before we attempt a reload — the packaged unit asserts on
    # /sys/kernel/security/apparmor/.load, so reloading it on a disabled host
    # would fail there instead of at the actionable assert below.
    - name: Check whether the AppArmor LSM is active (apparmorfs present)
      ansible.builtin.stat:
        path: /sys/kernel/security/apparmor/profiles
      register: apparmor_securityfs
      become: true
      when: apparmor_runtime_managed | bool

    # The role's purpose is to ensure MAC is active, so a disabled managed host
    # fails with guidance instead of silently skipping the rest.
    - name: Assert AppArmor is actually enabled on this host
      ansible.builtin.assert:
        that:
          - apparmor_securityfs.stat.exists
        fail_msg: >-
          AppArmor is not active on this host (no /sys/kernel/security/apparmor).
          Check the kernel is booted with 'apparmor=1 security=apparmor' and that
          securityfs is mounted, then reboot. Set apparmor_require_enabled=false
          to allow this host to run without AppArmor.
        quiet: true
      when:
        - apparmor_runtime_managed | bool
        - apparmor_require_enabled | bool

    # True only on a managed host where the LSM is actually active. Everything
    # that needs AppArmor running (reload, status read, mode changes, audit) is
    # gated on this, so a disabled host allowed via apparmor_require_enabled is
    # not failed by a reload of an inactive unit.
    - name: Set whether AppArmor is active and manageable
      ansible.builtin.set_fact:
        apparmor_active: "{{ apparmor_runtime_managed | bool and (apparmor_securityfs.stat.exists | default(false)) }}"

    # Load any newly installed profiles NOW (before the audit/mode changes read
    # aa-status). systemctl start is a no-op on an already-running service, so
    # without this the audit would run against the stale loaded set. The Reload
    # AppArmor handler is gated on apparmor_active, so this flush only reloads
    # where AppArmor is up.
    - name: Load newly installed AppArmor profiles before auditing
      ansible.builtin.meta: flush_handlers

    - name: Read the current AppArmor profile status
      ansible.builtin.command:
        cmd: aa-status --json
      register: apparmor_status_raw
      changed_when: false
      failed_when: false
      become: true
      when: apparmor_active | bool

    - name: Parse the AppArmor profile modes
      ansible.builtin.set_fact:
        apparmor_profile_modes: "{{ (apparmor_status_raw.stdout | from_json).profiles | default({}) }}"
      when:
        - apparmor_active | bool
        - apparmor_status_raw.rc | default(1) == 0
        - apparmor_status_raw.stdout | default('') | length > 0

    # Idempotent: only act on profiles that are loaded and not already in the
    # target mode. changed_when reflects the tool actually transitioning the
    # profile ("Setting <p> to ... mode.") so a no-op is not reported as a
    # change; a genuine failure (unknown profile) still fails the task.
    - name: Set opted-in profiles to complain mode
      ansible.builtin.command:
        cmd: "aa-complain {{ item }}"
      loop: "{{ apparmor_complain_profiles }}"
      loop_control:
        label: "{{ item }}"
      become: true
      register: apparmor_complain_result
      changed_when: "'Setting' in (apparmor_complain_result.stdout | default(''))"
      when:
        - apparmor_active | bool
        - apparmor_profile_modes is defined
        - item in apparmor_profile_modes
        - apparmor_profile_modes[item] != 'complain'

    - name: Set opted-in profiles to enforce mode
      ansible.builtin.command:
        cmd: "aa-enforce {{ item }}"
      loop: "{{ apparmor_enforce_profiles }}"
      loop_control:
        label: "{{ item }}"
      become: true
      register: apparmor_enforce_result
      changed_when: "'Setting' in (apparmor_enforce_result.stdout | default(''))"
      when:
        - apparmor_active | bool
        - apparmor_profile_modes is defined
        - item in apparmor_profile_modes
        - apparmor_profile_modes[item] != 'enforce'

    - name: Report the AppArmor profile-mode summary (with -v)
      ansible.builtin.debug:
        msg: >-
          AppArmor: {{ apparmor_profile_modes | dict2items | selectattr('value', 'eq', 'enforce') | list | length }} enforce,
          {{ apparmor_profile_modes | dict2items | selectattr('value', 'eq', 'complain') | list | length }} complain
          ({{ apparmor_profile_modes | length }} profiles loaded).
        verbosity: 1
      when:
        - apparmor_audit | bool
        - apparmor_active | bool
        - apparmor_profile_modes is defined
