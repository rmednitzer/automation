---
# Molecule scenario for the `ssh_hardening` role.
#
# Requires Docker. First executed live 2026-06-10 (LIMITATIONS L2 closure):
# full `molecule test` (converge + idempotence + verify) green on noble +
# resolute; gates in CI on push/PR. Run locally:
#
#   pip install molecule molecule-plugins[docker] docker
#   cd roles/ssh_hardening && molecule test
#
# Dual-OS matrix (ADR-004): both 24.04 (noble) and 26.04 (resolute) so the
# hardened sshd_config parses on each release's OpenSSH.

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ssh-noble
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: ssh-resolute
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    # Resolve the role under test from the repo's roles/ tree. Surfaced by the
    # first live Docker run (LIMITATIONS L2): molecule no longer injects the
    # role's parent directory into the roles path, so include_role fails with
    # "role not found" without this.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks

verifier:
  name: ansible
