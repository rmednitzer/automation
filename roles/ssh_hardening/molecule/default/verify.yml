---
# Verify: assert the key outcomes of the ssh_hardening role.
# Proves the hardened sshd_config parses and that weak crypto is absent —
# the failure modes a static lint cannot catch (LIMITATIONS L2/L3).
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Validate sshd configuration parses (sshd -t)
      ansible.builtin.command:
        cmd: sshd -t
      register: ssh_sshd_t
      changed_when: false

    - name: Assert sshd -t reported no errors
      ansible.builtin.assert:
        that:
          - ssh_sshd_t.rc == 0
        fail_msg: "sshd -t failed: the deployed sshd_config does not parse"
        success_msg: "sshd_config parses cleanly"

    - name: Dump the effective sshd configuration
      ansible.builtin.command:
        cmd: sshd -T
      register: ssh_sshd_dump
      changed_when: false

    - name: Normalise effective config to a lowercase blob
      ansible.builtin.set_fact:
        ssh_effective: "{{ ssh_sshd_dump.stdout | lower }}"

    - name: Assert core hardening directives are in effect
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in ssh_effective"
          - "'passwordauthentication no' in ssh_effective"
          - "'permitemptypasswords no' in ssh_effective"
          - "'x11forwarding no' in ssh_effective"
        fail_msg: >-
          sshd effective config is missing a core hardening directive
          (root login / password auth / empty passwords / X11 forwarding).

    - name: Assert weak KEX algorithms are absent
      ansible.builtin.assert:
        that:
          - "'diffie-hellman-group1-sha1' not in ssh_effective"
          - "'diffie-hellman-group14-sha1' not in ssh_effective"
          - "'diffie-hellman-group-exchange-sha1' not in ssh_effective"
        fail_msg: "a SHA-1 / group1 key-exchange algorithm is still enabled"

    - name: Assert weak ciphers and MACs are absent
      ansible.builtin.assert:
        that:
          - "'3des-cbc' not in ssh_effective"
          - "'arcfour' not in ssh_effective"
          - "'aes128-cbc' not in ssh_effective"
          - "'aes256-cbc' not in ssh_effective"
          - "'hmac-md5' not in ssh_effective"
          - "'hmac-sha1' not in ssh_effective"
        fail_msg: "a weak (CBC / RC4 / MD5 / SHA-1) cipher or MAC is enabled"

    - name: Stat the SSH banner
      ansible.builtin.stat:
        path: /etc/ssh/banner
      register: ssh_banner_stat

    - name: Assert the legal banner was deployed (GDPR Art 5(2))
      ansible.builtin.assert:
        that:
          - ssh_banner_stat.stat.exists
        fail_msg: "/etc/ssh/banner missing — monitoring notice not deployed"

    - name: Assert sshd service is enabled and running
      ansible.builtin.service_facts:

    - name: Verify the ssh unit is running
      ansible.builtin.assert:
        that:
          - "'ssh.service' in ansible_facts.services"
          - ansible_facts.services['ssh.service'].state == 'running'
        fail_msg: "ssh.service is not running after converge"
