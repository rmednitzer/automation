---
# SSH hardening role for Ubuntu 24.04/26.04 LTS

- name: Ensure OpenSSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# sshd -t (the validate: below) refuses to run without the privilege-
# separation directory, which is created at service start (tmpfiles.d) — so
# validation fails on a host where sshd is installed but has not yet started
# (fresh install before first boot, or a container where policy-rc.d blocks
# the postinst service start; surfaced by the first live Molecule run,
# LIMITATIONS L2). Pre-create it with the packaged owner/mode.
- name: Ensure sshd privilege-separation directory exists (sshd -t needs it)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: "sshd -t -f %s"
  become: true
  notify: Restart sshd

- name: Deploy SSH banner
  ansible.builtin.template:
    src: banner.j2
    dest: "{{ ssh_banner_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: ssh_banner_enabled

- name: Detect weak Diffie-Hellman moduli
  ansible.builtin.command:
    cmd: awk '$5 < 3071 {c++} END {print c+0}' /etc/ssh/moduli
  register: ssh_weak_moduli
  changed_when: false
  check_mode: false
  become: true

- name: Remove small Diffie-Hellman moduli
  ansible.builtin.shell:
    cmd: >-
      awk '$5 >= 3071' /etc/ssh/moduli > /etc/ssh/moduli.safe
      && [ -s /etc/ssh/moduli.safe ]
      && mv /etc/ssh/moduli.safe /etc/ssh/moduli
      || { rm -f /etc/ssh/moduli.safe; exit 1; }
  when: ssh_weak_moduli.stdout | int > 0
  changed_when: true
  become: true

- name: Ensure sshd is enabled and running
  ansible.builtin.systemd_service:
    name: ssh
    state: started
    enabled: true
  become: true
