---
# install_kubectx.yml — install kubectx/kubens from the upstream source
# tarball. The project ships both as shell scripts inside a tagged source
# archive and publishes no per-asset checksum; under
# sre_toolchain_checksum_policy: strict this tool is intentionally skipped.

- name: "Compose target paths"
  ansible.builtin.set_fact:
    kubectx_target_ctx: "{{ sre_toolchain_dest_dir }}/kubectx"
    kubectx_target_ns: "{{ sre_toolchain_dest_dir }}/kubens"
    tool_headers: >-
      {{
        {'Accept': 'application/vnd.github+json',
         'User-Agent': 'sre-toolchain-installer/1.0'}
        | combine(
            {'Authorization': 'Bearer ' + sre_toolchain_github_token}
            if sre_toolchain_github_token | length > 0 else {})
      }}

- name: "Check whether already installed"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: kubectx_stat
  loop:
    - "{{ kubectx_target_ctx }}"
    - "{{ kubectx_target_ns }}"
  become: true

- name: "Decide whether to skip"
  ansible.builtin.set_fact:
    kubectx_skip: >-
      {{ (not sre_toolchain_force)
         and (kubectx_stat.results | map(attribute='stat.exists')
                                   | select('equalto', true)
                                   | list | length) == 2 }}

- name: "SKIP — already installed"
  when: kubectx_skip
  block:
    # Read the recorded version from the previous manifest fact (parsed once
    # in main.yml) rather than shelling out to jq, so a skip-only re-converge
    # reproduces the same tools map. kubectx/kubens publish no checksum, so
    # the install path records no evidence entry for them — the skip path
    # likewise adds none, keeping the manifest stable (idempotent).
    - name: "Record existing version"
      ansible.builtin.set_fact:
        sre_toolchain_installed: >-
          {{ sre_toolchain_installed
             | combine({'kubectx': (sre_toolchain_prev_manifest.tools | default({}))['kubectx']
                                   | default('unknown'),
                        'kubens':  (sre_toolchain_prev_manifest.tools | default({}))['kubens']
                                   | default('unknown')}) }}
        sre_toolchain_skipped: "{{ (sre_toolchain_skipped | int) + 1 }}"

# kubectx/kubens publish no upstream checksum, so under the strict policy
# they are skipped (counted as skipped, not failed) rather than aborting the
# whole run — opt in with sre_toolchain_checksum_policy: best-effort or by
# removing 'kubectx' from sre_toolchain_skip. (Codex/Copilot review.)
- name: "Skip kubectx/kubens under strict checksum policy (no upstream sums)"
  ansible.builtin.set_fact:
    sre_toolchain_skipped: "{{ (sre_toolchain_skipped | int) + 1 }}"
  when:
    - not kubectx_skip
    - sre_toolchain_checksum_policy == 'strict'

- name: "Install from source tarball"
  when:
    - not kubectx_skip
    - sre_toolchain_checksum_policy != 'strict'
  block:
    - name: "Fetch latest release tag"
      ansible.builtin.uri:
        url: https://api.github.com/repos/ahmetb/kubectx/releases/latest
        headers: "{{ tool_headers }}"
        return_content: true
        status_code: [200]
        body_format: json
      register: kubectx_release

    - name: "Resolve archive URL"
      ansible.builtin.set_fact:
        kubectx_tag: "{{ kubectx_release.json.tag_name }}"
        kubectx_url: >-
          https://github.com/ahmetb/kubectx/archive/refs/tags/{{
            kubectx_release.json.tag_name }}.tar.gz

    - name: "Announce planned install"
      ansible.builtin.debug:
        msg: "INSTALL kubectx,kubens @ {{ kubectx_tag }} (source tarball)"

    - name: "Prepare extract directory"
      ansible.builtin.file:
        path: "{{ sre_toolchain_tmp_dir }}/kubectx-src"
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: "Download source archive"
      ansible.builtin.get_url:
        url: "{{ kubectx_url }}"
        dest: "{{ sre_toolchain_tmp_dir }}/kubectx-src.tgz"
        headers: "{{ tool_headers }}"
        mode: "0640"
        force: true
      become: true

    - name: "Extract source archive"
      ansible.builtin.unarchive:
        src: "{{ sre_toolchain_tmp_dir }}/kubectx-src.tgz"
        dest: "{{ sre_toolchain_tmp_dir }}/kubectx-src"
        remote_src: true
      become: true

    - name: "Install kubectx"
      ansible.builtin.copy:
        src: >-
          {{ sre_toolchain_tmp_dir }}/kubectx-src/kubectx-{{
            kubectx_tag | regex_replace('^v', '') }}/kubectx
        dest: "{{ kubectx_target_ctx }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      become: true

    - name: "Install kubens"
      ansible.builtin.copy:
        src: >-
          {{ sre_toolchain_tmp_dir }}/kubectx-src/kubectx-{{
            kubectx_tag | regex_replace('^v', '') }}/kubens
        dest: "{{ kubectx_target_ns }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      become: true

    - name: "Record installed version"
      ansible.builtin.set_fact:
        sre_toolchain_installed: >-
          {{ sre_toolchain_installed
             | combine({'kubectx': kubectx_tag, 'kubens': kubectx_tag}) }}
        sre_toolchain_ok: "{{ (sre_toolchain_ok | int) + 1 }}"
  rescue:
    - name: "Mark failure and continue"
      ansible.builtin.set_fact:
        sre_toolchain_fail: "{{ (sre_toolchain_fail | int) + 1 }}"
    - name: "Log failure"
      ansible.builtin.debug:
        msg: >-
          FAIL kubectx,kubens —
          {{ ansible_failed_result.msg | default('see preceding task output') }}
