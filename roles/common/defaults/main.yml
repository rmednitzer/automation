---
# Common role defaults
#
# Compliance references:
#   - NIS2 Art 21.2(a) — policies on risk analysis and information system security
#   - NIS2 Art 21.2(e) — network and information systems security
#   - GDPR Art 32 — security of processing (appropriate technical measures)
#   - GDPR Art 25 — data protection by design and by default
#   - GDPR Art 5(1)(c) — data minimisation (IPv6 privacy extensions)
#   - CRA Annex I Part I — secure-by-default, minimal attack surface
#   - ISO 27001:2022 A.8.9 — configuration management
#   - CTL-002 — immutable evidence store with retention controls
#   - CTL-003 — logging legality, minimisation, and forensic correlation
#   - POL-004 — data classification and handling policy

# Timezone (UTC for consistent log correlation per CTL-003)
common_timezone: "UTC"

# Locale
common_locale: "en_US.UTF-8"
common_language: "en_US.UTF-8"

# Base packages to install
common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - vim
  - htop
  - tmux
  - git
  - wget
  - unzip
  - jq
  - net-tools
  - dnsutils
  - mtr-tiny
  - rsync
  - tree
  - ncdu
  - iotop
  - sysstat
  - logrotate

# Packages to remove (bloat / unnecessary)
common_packages_remove: []

# Automatic security updates via unattended-upgrades
# NIS2 Art 21.2(e) — vulnerability handling without delay
# CRA Annex I Part I — no known exploitable vulnerabilities
common_auto_updates_enabled: true
common_auto_updates_mail: ""
common_auto_updates_reboot: false
common_auto_updates_reboot_time: "02:00"

# Sysctl tuning
# NIS2 Art 21.2(e) — network security
# CRA Annex I Part I — protection of attack surface
# GDPR Art 5(1)(c) — data minimisation (IPv6 privacy)
common_sysctl_settings:
  # Network performance
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
  net.ipv4.tcp_rmem: "4096 87380 16777216"
  net.ipv4.tcp_wmem: "4096 65536 16777216"
  net.core.netdev_max_backlog: 5000
  # Network security hardening
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  # Ignore ICMP redirects even from gateways (CIS 3.3.x secure_redirects).
  # Override on hosts that legitimately need them.
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.tcp_syncookies: 1
  # Disable IP forwarding (CIS 3.1.x — host is not a router). Routers/NAT
  # gateways must override these two to 1.
  net.ipv4.ip_forward: 0
  net.ipv6.conf.all.forwarding: 0
  # IPv6 hardening
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.default.accept_ra: 0
  # IPv6 privacy extensions — GDPR Art 5(1)(c) data minimisation
  net.ipv6.conf.all.use_tempaddr: 2
  net.ipv6.conf.default.use_tempaddr: 2
  # VM tuning
  vm.swappiness: 10
  vm.dirty_ratio: 15
  vm.dirty_background_ratio: 5
  # File handles
  fs.file-max: 2097152
  # Protect hardlinks/symlinks
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1
  # Protect against file-creation races in world-writable sticky dirs.
  # KSPP recommends fs.protected_fifos=2 / fs.protected_regular=2 (apply to
  # both group- and other-writable sticky dirs). Present since kernel 4.19,
  # so safe on both 24.04 (6.8) and 26.04 (7.0). KSPP Recommended_Settings.
  fs.protected_fifos: 2
  fs.protected_regular: 2
  # Additional kernel hardening (CIS-aligned). Overridable — disable on
  # hosts that legitimately need kexec (live-patching) or perf profiling.
  # Block kexec so a new kernel cannot be loaded at runtime (CIS 1.5.x).
  kernel.kexec_load_disabled: 1
  # Do not auto-load line disciplines on demand (CIS 1.5.x — TTY hijack).
  dev.tty.ldisc_autoload: 0
  # Restrict perf_event_open to privileged users (CIS — side-channel risk).
  kernel.perf_event_paranoid: 2
  # Harden the eBPF JIT against heap-spray / branch-predictor attacks
  # (KSPP + CIS Ubuntu 24.04 §1; present since kernel 4.7). Overridable.
  net.core.bpf_jit_harden: 2
  # Disable unprivileged userfaultfd — a recurring use-after-free LPE
  # primitive (KSPP; present since kernel 5.11, so on both 6.8 and 7.0).
  vm.unprivileged_userfaultfd: 0

# Kernel-version-dependent sysctls. These knobs may be ABSENT depending on
# the kernel's compile-time config, so they are applied only when their
# /proc/sys path exists (see tasks/sysctl.yml). This keeps the role
# idempotent across the 24.04 (kernel 6.8) / 26.04 (kernel 7.0) matrix
# without weakening either: where a knob is missing it is skipped, where it
# is present it is enforced. Override values here; set a key's value to the
# kernel default to effectively disable enforcement.
common_sysctl_settings_optional:
  # Restrict io_uring, a prominent local-privilege-escalation attack surface
  # in recent kernels. 0=unrestricted (kernel default), 1=disabled for
  # unprivileged processes outside kernel.io_uring_group, 2=disabled for all.
  # The sysctl exists on kernel >= 6.6 (both 6.8 and 7.0 have it) but is
  # gated defensively. Default 1 (block unprivileged use) — CIS Ubuntu 24.04
  # §1 io_uring lockdown. Hosts whose workloads need io_uring must override
  # to 0. Ref: kernel.io_uring_disabled (Documentation/admin-guide/sysctl).
  kernel.io_uring_disabled: 1
  # Block legacy TIOCSTI terminal-injection (CVE class: command injection
  # into a parent shell). The sysctl ONLY exists when the kernel is built
  # with CONFIG_LEGACY_TIOCSTI=y; hardened kernels compile it out, in which
  # case TIOCSTI is already disabled and this key's /proc path is absent.
  # KSPP recommends dev.tty.legacy_tiocsti=0. Path-gated so it is a no-op on
  # kernels that lack the knob (TIOCSTI already off there).
  dev.tty.legacy_tiocsti: 0

# Systemd journal max size
# CTL-003 — retention per log category
common_journal_max_size: "500M"
common_journal_max_retention: "6month"

# MOTD banner
common_motd_enabled: true

# Core kernel-hardening sysctls applied by tasks/kernel_hardening.yml.
# Broken out as overridable variables (previously hardcoded in the task) so
# operators can tune them per host without editing tasks — defaults are
# unchanged (no weakening). Values are KSPP / CIS Ubuntu 24.04 §1 aligned
# and present on both kernel 6.8 (24.04) and 7.0 (26.04).
#   kptr_restrict=2          hide kernel pointers from all users (KSPP)
#   dmesg_restrict=1         restrict dmesg to CAP_SYSLOG (KSPP, CIS 1.5.x)
#   unprivileged_bpf=1       no unprivileged bpf() syscall (KSPP, CIS)
#   randomize_va_space=2     full ASLR (KSPP)
#   ptrace_scope=2           admin-only ptrace (CIS Ubuntu 24.04; KSPP=3).
#                            Kept at 2 (not 3) so privileged debuggers still
#                            work; raise to 3 for the strictest posture, or
#                            lower to 1 on hosts that debug across processes.
common_kernel_kptr_restrict: 2
common_kernel_dmesg_restrict: 1
common_kernel_unprivileged_bpf_disabled: 1
common_kernel_randomize_va_space: 2
common_kernel_ptrace_scope: 2

# Kernel module blacklist (disable unnecessary/risky modules)
# CRA Annex I Part I — minimal attack surface
common_kernel_modules_blacklist:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - udf
  - usb-storage
  - dccp
  - sctp
  - rds
  - tipc

# Filesystem hardening - mount options for /tmp
common_harden_tmp: true
common_tmp_size: "2G"
# Immediately remount /tmp (and bind /var/tmp) when applying the baseline.
# A live remount of /tmp on a running host disrupts services holding open
# files there and discards existing /tmp contents. Default false: only the
# fstab entry is written; hardened options take effect on next boot. Set
# true for fresh hosts where an immediate remount is safe.
common_harden_tmp_remount: false

# Disable core dumps
# POL-004 — Restricted data must not leak via core dumps
common_disable_core_dumps: true

# Services to disable (common bloat on Ubuntu)
common_services_disable:
  - apport
  - whoopsie

# Log retention categories (see docs/compliance-controls.yml)
# CTL-002 — immutable evidence store with retention controls
# CTL-003 — logging legality, minimisation, and forensic correlation
common_log_retention:
  # Governance logs (board minutes, policy approvals, access reviews): 10 years
  governance: "3650"
  # Incident logs: 5 years
  incidents: "1825"
  # CI/build evidence: 3 years
  ci: "1095"
  # DR test evidence: 5 years
  dr_tests: "1825"
  # Security audit logs (auditd, auth): 1 year minimum
  security_audit: "365"
  # Operational logs (syslog, journal): 90 days
  operational: "90"
