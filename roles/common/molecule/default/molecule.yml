---
# Molecule scenario for the `common` role.
#
# NOTE: requires Docker, unavailable in the current CI sandbox, so this
# scenario is authored and YAML/lint-validated but has NOT been executed
# here (LIMITATIONS.md L2/L3). Run on a Docker-enabled host:
#
#   pip install molecule molecule-plugins[docker] docker
#   cd roles/common && molecule test
#
# CONTAINER CAVEAT: some kernel-global sysctls (kptr_restrict, ptrace_scope,
# io_uring_disabled, …) are read-only or namespaced inside a container, so
# verify.yml asserts the written /etc/sysctl.d/90-ansible.conf drop-in
# (always produced) rather than only the live `sysctl` value. The optional
# path-gated knobs (io_uring_disabled, legacy_tiocsti) are exercised by the
# probe-then-apply path: where the kernel lacks the knob the task is
# skipped, which is exactly the cross-kernel behaviour under test (ADR-004).
#
# Dual-OS matrix (ADR-004): 24.04 (noble, kernel 6.8) + 26.04 (resolute,
# kernel 7.0) — proves the path-gated optional sysctls behave on both.

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: common-noble
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: common-resolute
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      common-noble:
        # /tmp is a tmpfs in the container already; never live-remount it
        # from under the running services (default false, set explicitly).
        common_harden_tmp_remount: false
      common-resolute:
        common_harden_tmp_remount: false

verifier:
  name: ansible
