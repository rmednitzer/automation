---
# Kernel hardening tasks
#
# The `ansible.posix.sysctl` tasks below write into the SAME drop-in as
# tasks/sysctl.yml (/etc/sysctl.d/90-ansible.conf). sysctl.yml owns the file
# and prunes any key not in the role's managed set, so the sysctl key names
# applied here are enumerated in defaults as common_kernel_hardening_sysctl_keys
# for that prune. KEEP THAT LIST IN SYNC: if you add/remove a sysctl key here,
# update common_kernel_hardening_sysctl_keys too, or sysctl.yml will prune the
# new key (or fail to prune a removed one).

- name: Blacklist unnecessary kernel modules
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/ansible-blacklist-{{ item }}.conf"
    content: |
      # Ansible managed
      install {{ item }} /bin/true
      blacklist {{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ common_kernel_modules_blacklist }}"
  become: true

- name: Disable core dumps via limits.conf
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-ansible-coredump.conf
    content: |
      # Ansible managed
      * hard core 0
      * soft core 0
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_disable_core_dumps

- name: Disable core dumps via sysctl
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: "0"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: true
    state: present
  become: true
  when: common_disable_core_dumps

- name: Disable core dumps in systemd
  ansible.builtin.lineinfile:
    path: /etc/systemd/coredump.conf
    regexp: "^#?Storage="
    line: "Storage=none"
  become: true
  when: common_disable_core_dumps

- name: Ensure ASLR is enabled
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: "{{ common_kernel_randomize_va_space | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: true
    state: present
  become: true

- name: Restrict kernel pointer exposure
  ansible.posix.sysctl:
    name: kernel.kptr_restrict
    value: "{{ common_kernel_kptr_restrict | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: true
    state: present
  become: true

- name: Restrict dmesg access to root
  ansible.posix.sysctl:
    name: kernel.dmesg_restrict
    value: "{{ common_kernel_dmesg_restrict | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: true
    state: present
  become: true

- name: Restrict unprivileged BPF
  ansible.posix.sysctl:
    name: kernel.unprivileged_bpf_disabled
    value: "{{ common_kernel_unprivileged_bpf_disabled | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: true
    state: present
  become: true

# kernel.unprivileged_userns_clone is a Debian/Ubuntu-only sysctl; mainline
# kernels expose user.max_user_namespaces instead. On kernel 7.0 (26.04)
# Ubuntu still carries the downstream knob, but keep failed_when:false so the
# role does not abort if a future kernel drops it. Unprivileged user
# namespaces remain a notable LPE surface (KSPP).
- name: Restrict unprivileged user namespaces
  ansible.posix.sysctl:
    name: kernel.unprivileged_userns_clone
    value: "0"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: true
    state: present
  become: true
  failed_when: false

- name: Restrict ptrace scope
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "{{ common_kernel_ptrace_scope | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: true
    state: present
  become: true
