---
# Kernel hardening tasks
#
# The `ansible.posix.sysctl` tasks below write into the SAME drop-in as
# tasks/sysctl.yml (/etc/sysctl.d/90-ansible.conf). sysctl.yml owns the file
# and prunes any key not in the role's managed set, so the sysctl key names
# applied here are enumerated in defaults as common_kernel_hardening_sysctl_keys
# for that prune. KEEP THAT LIST IN SYNC: if you add/remove a sysctl key here,
# update common_kernel_hardening_sysctl_keys too, or sysctl.yml will prune the
# new key (or fail to prune a removed one).

# /etc/modprobe.d is shipped by the kmod package on a regular host, but
# minimal images (containers; surfaced by the first live Molecule run,
# LIMITATIONS L2) omit it — and ansible.builtin.copy does not create the
# destination directory. Ensure it exists with the packaged owner/mode.
- name: Ensure /etc/modprobe.d exists
  ansible.builtin.file:
    path: /etc/modprobe.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Blacklist unnecessary kernel modules
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/ansible-blacklist-{{ item }}.conf"
    content: |
      # Ansible managed
      install {{ item }} /bin/true
      blacklist {{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ common_kernel_modules_blacklist }}"
  become: true

- name: Disable core dumps via limits.conf
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-ansible-coredump.conf
    content: |
      # Ansible managed
      * hard core 0
      * soft core 0
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_disable_core_dumps

- name: Disable core dumps via sysctl
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: "0"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: "{{ common_sysctl_reload | bool }}"
    state: present
  become: true
  when: common_disable_core_dumps

# Drop-in rather than lineinfile on /etc/systemd/coredump.conf: the stock
# file is absent on minimal installs (surfaced by the first live Molecule
# run, LIMITATIONS L2), drop-ins survive package upgrades, and this matches
# the role's limits.d / sysctl.d drop-in style.
- name: Ensure the coredump.conf.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: common_disable_core_dumps

- name: Disable core dumps in systemd (coredump.conf drop-in)
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/99-ansible.conf
    content: |
      # Ansible managed
      [Coredump]
      Storage=none
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_disable_core_dumps

- name: Ensure ASLR is enabled
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: "{{ common_kernel_randomize_va_space | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: "{{ common_sysctl_reload | bool }}"
    state: present
  become: true

- name: Restrict kernel pointer exposure
  ansible.posix.sysctl:
    name: kernel.kptr_restrict
    value: "{{ common_kernel_kptr_restrict | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: "{{ common_sysctl_reload | bool }}"
    state: present
  become: true

- name: Restrict dmesg access to root
  ansible.posix.sysctl:
    name: kernel.dmesg_restrict
    value: "{{ common_kernel_dmesg_restrict | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: "{{ common_sysctl_reload | bool }}"
    state: present
  become: true

- name: Restrict unprivileged BPF
  ansible.posix.sysctl:
    name: kernel.unprivileged_bpf_disabled
    value: "{{ common_kernel_unprivileged_bpf_disabled | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: "{{ common_sysctl_reload | bool }}"
    state: present
  become: true

# The two knobs below are KERNEL-DEPENDENT, so they get the same
# probe-then-apply treatment as the optional map in tasks/sysctl.yml:
# kernel.unprivileged_userns_clone is a Debian/Ubuntu-only patch (mainline
# exposes user.max_user_namespaces instead), and kernel.yama.ptrace_scope
# only exists where the Yama LSM is enabled. Probing replaces the previous
# blanket failed_when:false on userns_clone — an absent key is skipped (and
# kept out of the drop-in) instead of masking every failure; a kernel that
# drops the knob re-converges cleanly. Surfaced by the first live Molecule
# run (LIMITATIONS L2) on a host kernel that carries neither. Unprivileged
# user namespaces remain a notable LPE surface (KSPP).
- name: Probe the kernel-dependent hardening sysctls for a live /proc/sys path
  ansible.builtin.stat:
    path: "/proc/sys/{{ item | replace('.', '/') }}"
  loop:
    - kernel.unprivileged_userns_clone
    - kernel.yama.ptrace_scope
  loop_control:
    label: "{{ item }}"
  register: common_kernel_hardening_probe
  become: true

- name: Partition the kernel-dependent hardening keys into the present set
  ansible.builtin.set_fact:
    common_kernel_hardening_keys_present: >-
      {{ common_kernel_hardening_probe.results
         | selectattr('stat.exists')
         | map(attribute='item')
         | list }}

- name: Restrict unprivileged user namespaces
  ansible.posix.sysctl:
    name: kernel.unprivileged_userns_clone
    value: "0"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: "{{ common_sysctl_reload | bool }}"
    state: present
  become: true
  when: "'kernel.unprivileged_userns_clone' in common_kernel_hardening_keys_present"

- name: Restrict ptrace scope
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "{{ common_kernel_ptrace_scope | string }}"
    sysctl_file: /etc/sysctl.d/90-ansible.conf
    reload: "{{ common_sysctl_reload | bool }}"
    state: present
  become: true
  when: "'kernel.yama.ptrace_scope' in common_kernel_hardening_keys_present"
