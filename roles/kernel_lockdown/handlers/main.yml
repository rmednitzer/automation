---
# kernel_lockdown handlers.

# Regenerate /boot/grub/grub.cfg so the lockdown= cmdline change (added/removed
# via the grub.d drop-in) is written into the boot entries. Takes effect on the
# next boot.
- name: Regenerate grub configuration
  ansible.builtin.command:
    cmd: update-grub
  become: true
  changed_when: true

# A kernel command-line change (level set OR drop-in removed) only applies after
# a reboot, and the role never reboots a host itself. Surface that clearly when
# the drop-in changed.
- name: Kernel lockdown reboot required
  ansible.builtin.debug:
    msg: >-
      Kernel lockdown boot configuration changed (desired level:
      '{{ kernel_lockdown_level or 'none' }}'). A REBOOT is required to apply it;
      the role does not reboot hosts. Lockdown is only lowered after a reboot.
