---
# Kernel lockdown LSM role defaults.
#
# Compliance references:
#   - POL-004 — data classification & handling: the kernel lockdown LSM
#     protects the running kernel's integrity (lockdown=integrity blocks
#     runtime tampering: unsigned modules, kexec, /dev/mem, raw MSR/PCI) and,
#     at lockdown=confidentiality, also blocks reading kernel memory that could
#     leak secrets (/dev/kmem, perf, kprobes). That is the integrity- and
#     confidentiality-of-processing posture POL-004 asks for, enforced at the
#     kernel boundary beneath the per-service controls.
#   - CRA (EU 2024/2847) Annex I Part I — minimise attack surface / tamper
#     resistance of the platform.
#   - NIS2 Art 21.2(e) — security in network and information systems.
#   - GDPR Art 5(1)(f) — integrity and confidentiality; Art 25 — by design.
#   - ISO 27001:2022 A.8.27 — secure system architecture & engineering.
#
# Targets Ubuntu 24.04 / 26.04 LTS (GRUB bootloader). See docs/ADR-004.

# Master switch. Safe-by-default: the role AUDITS the current lockdown level
# and changes nothing on the boot command line unless kernel_lockdown_level is
# set below. A baseline run is therefore read-only.
kernel_lockdown_enabled: true

# Manage the runtime (audit reads + the GRUB cmdline drop-in). Auto-off in
# container GUESTS: lockdown is a host-kernel property, /sys/kernel/security is
# the host's, and there is no bootloader to manage. A container/LXC *host* is
# managed normally — same ansible_virtualization_role == 'guest' check as the
# auditd / dns / apparmor roles.
kernel_lockdown_manage_runtime: true

# Desired lockdown level (OPT-IN). One of:
#   ""               — audit only; do NOT touch the kernel command line (default)
#   "integrity"      — block runtime kernel tampering (unsigned modules, kexec,
#                      /dev/mem, hibernation image, raw I/O). Safe for most
#                      servers; breaks loading UNSIGNED out-of-tree modules.
#   "confidentiality"— integrity PLUS block kernel-memory disclosure (perf,
#                      kprobes, /dev/kmem). Stricter; also breaks hibernation
#                      and many kernel-debugging / tracing workflows.
# Applied by appending lockdown=<level> to the GRUB kernel command line via an
# /etc/default/grub.d drop-in. REQUIRES A REBOOT to take effect (the role does
# not reboot — it regenerates grub.cfg and flags that a reboot is needed).
# Note: lockdown can only be RAISED, never lowered, without a reboot; with
# Secure Boot enabled many kernels already start at lockdown=integrity.
kernel_lockdown_level: ""

# Read /sys/kernel/security/lockdown and report the current level (read-only).
kernel_lockdown_audit: true

# Path of the GRUB drop-in this role manages (Ubuntu sources /etc/default/grub.d
# /*.cfg from grub-mkconfig, so we compose rather than edit /etc/default/grub).
kernel_lockdown_grub_dropin: /etc/default/grub.d/99-lockdown.cfg
