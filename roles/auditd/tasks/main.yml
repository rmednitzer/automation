---
# Auditd role for Ubuntu 24.04/26.04 LTS

# Decide whether to manage the running auditd daemon. The audit subsystem is
# host-global (not namespaced), so inside a container GUEST auditd cannot start
# and auditctl/augenrules fail (EPERM); managing it there aborts the play.
# Compute the effective value once: honour auditd_manage_runtime AND skip only
# when this host is a container *guest* — i.e. a container virtualization type
# AND virtualization_role == 'guest'. The role check matters because an LXC/
# container HOST reports type 'lxc' with role 'host' yet owns the real,
# host-global audit subsystem and must still manage it. The config + rules
# files below are deployed regardless (config-as-code) — only the runtime
# steps are gated.
- name: Determine whether to manage the auditd runtime
  ansible.builtin.set_fact:
    auditd_runtime_managed: >-
      {{ auditd_manage_runtime | bool
         and not ((ansible_virtualization_type | default('')) in ['docker', 'podman', 'container', 'containerd', 'lxc', 'systemd-nspawn']
                  and (ansible_virtualization_role | default('host')) == 'guest') }}

- name: Install auditd and audispd-plugins
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Deploy auditd configuration
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
  become: true
  notify: Reload auditd configuration

- name: Deploy audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/99-ansible.rules
    owner: root
    group: root
    mode: "0640"
  become: true
  # The handler loads the rules now if the kernel is still mutable, or emits
  # a reboot notice if it is already locked (enabled 2).
  notify: Reload audit rules

- name: Enable and start auditd
  ansible.builtin.systemd_service:
    name: auditd
    state: started
    enabled: true
  become: true
  # Skipped in containers (see auditd_runtime_managed): auditd cannot own the
  # host-global audit subsystem there. The config/rules above are still
  # deployed, so a container converge + verify exercises the config-as-code.
  when: auditd_runtime_managed
