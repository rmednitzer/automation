---
galaxy_info:
  role_name: nftables_egress
  author: automation
  description: >-
    Default-deny outbound (egress) filtering with nftables: an allow-listed
    egress policy in a separate table that composes with ufw, off/observe/
    enforce modes, lock-out-safe, for Ubuntu 24.04 and 26.04 LTS
  license: Apache-2.0
  min_ansible_version: "2.18"
  platforms:
    - name: Ubuntu
      versions:
        - noble      # 24.04 LTS
        - resolute   # 26.04 LTS (kernel 7.0) — see docs/ADR-004
  galaxy_tags:
    - nftables
    - firewall
    - egress
    - hardening
    - security
    - ubuntu

dependencies: []
