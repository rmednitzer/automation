---
# Out-of-band (BMC) management via Redfish — role defaults.
#
# Compliance references:
#   - POL-001 — access control: a BMC is the most privileged access path to a
#     machine (pre-boot, persistent, out-of-band). This role centralises and
#     audits that access through the vendor-neutral Redfish API instead of
#     ad-hoc vendor tooling or legacy IPMI.
#   - CRA (EU 2024/2847) Annex I — secure management interfaces and firmware.
#   - NIS2 Art 21.2(d) supply chain / 21.2(e) — security of network and
#     information systems.
#   - ISO 27001:2022 A.8.2 — privileged access rights; A.8.9 — configuration
#     management.
#
# ASPIRATIONAL: the fleet has no enterprise BMCs yet, so this role is OFF by
# default and ships inert. See docs/ADR-005. Driven from the control/bastion
# host (delegate_to localhost) against the BMC endpoints below. Read-only
# inventory by default; power actions are HARD-GATED.

# Off by default (no BMCs in the fleet yet). playbooks/redfish-oob.yml enables it.
redfish_enabled: false

# BMC endpoints. Each entry: name, baseurl (https://<bmc-ip-or-host>), username,
# and a vault-backed password — defined in an inventory group_vars, e.g.:
#   redfish_bmcs:
#     - name: server01-bmc
#       baseurl: "https://10.50.0.11"
#       username: "automation"
#       password: "{{ vault_redfish_server01_password }}"
# Never commit a literal password; reference a vault_ variable.
redfish_bmcs: []

# TLS: verify the BMC certificate. Keep true; loosen per-BMC only for a lab
# device whose self-signed cert you have pinned out-of-band.
redfish_validate_certs: true
redfish_timeout: 30

# Action:
#   "inventory" — read-only: collect system, firmware and thermal inventory
#                 (the safe default).
#   "power"     — change power state — HARD-GATED (see below).
redfish_action: "inventory"

# Power control runs ONLY when BOTH redfish_action == "power" AND this flag is
# true, so a stray action variable can never cycle a machine's power.
redfish_confirm_state_change: false
# One of: On | ForceOff | GracefulShutdown | GracefulRestart | ForceRestart | Reboot
redfish_power_command: "GracefulRestart"
