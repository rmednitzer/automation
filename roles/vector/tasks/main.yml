---
# Vector: modern log shipper (journald -> SIEM). CTL-002 (evidence), CTL-003
# (centralised logging / forensic correlation).

- name: Assert a Vector sink is configured
  ansible.builtin.assert:
    that:
      - vector_sinks | length > 0
    fail_msg: >-
      vector_sinks must define at least one sink (where logs go) when the
      vector role is enabled — there is no safe default destination. See
      defaults/main.yml for examples; reference any secret via a vault var.
    quiet: true

# Only a container GUEST skips runtime management (the journald source needs the
# host journal and the unit may not run cleanly there); a container/LXC *host*
# runs Vector normally. The repo + config are applied regardless.
- name: Determine whether to manage the Vector runtime
  ansible.builtin.set_fact:
    vector_runtime_managed: >-
      {{ vector_manage_service | bool
         and not ((ansible_virtualization_type | default('')) in ['docker', 'podman', 'container', 'containerd', 'lxc', 'systemd-nspawn']
                  and (ansible_virtualization_role | default('host')) == 'guest') }}

- name: Ensure gnupg is present (for dearmoring the repo key)
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Fetch the Datadog/Vector repository signing keys (armored)
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "/usr/share/keyrings/vector-datadog-{{ item | basename }}.asc"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ vector_apt_key_urls }}"
  loop_control:
    label: "{{ item | basename }}"
  become: true
  register: vector_key_downloads

- name: Stat the dearmored apt keyring
  ansible.builtin.stat:
    path: "{{ vector_apt_keyring }}"
  register: vector_keyring_stat
  become: true

# Dearmor ALL fetched keys into one signed-by keyring (so metadata signed by any
# active key during a rotation verifies), refreshing whenever a key changes or
# the keyring is missing — not a one-time creates:, which would keep apt
# trusting a stale keyring after a rotation.
- name: Dearmor the Datadog keys into the apt keyring
  ansible.builtin.shell:
    cmd: "set -o pipefail; cat /usr/share/keyrings/vector-datadog-*.asc | gpg --batch --yes --dearmor -o {{ vector_apt_keyring }}"
    executable: /bin/bash
  become: true
  when: vector_key_downloads is changed or not vector_keyring_stat.stat.exists
  changed_when: true

# Optional supply-chain pin: after dearmoring (but before apt is configured to
# use the keyring) assert the keyring holds ONLY pinned fingerprints, so an
# unexpected key is never trusted. (Only when vector_apt_key_fingerprints set.)
- name: Verify the dearmored keyring fingerprints (when pinned)
  when: vector_apt_key_fingerprints | length > 0
  become: true
  block:
    - name: Read the keyring fingerprints
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          gpg --show-keys --with-colons {{ vector_apt_keyring }}
          | awk -F: '/^fpr:/ { print $10 }'
        executable: /bin/bash
      register: vector_keyring_fprs
      changed_when: false

    - name: Assert the keyring holds only pinned fingerprints
      ansible.builtin.assert:
        that:
          - (vector_keyring_fprs.stdout_lines | map('upper') | list | reject('in', vector_apt_key_fingerprints | map('replace', ' ', '') | map('upper') | list) | list | length) == 0
        fail_msg: >-
          The Datadog keyring contains a fingerprint not in
          vector_apt_key_fingerprints ({{ vector_keyring_fprs.stdout_lines }}).
          Refusing to trust the repository.
        quiet: true

- name: Ensure the apt keyring is world-readable
  ansible.builtin.file:
    path: "{{ vector_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure the Vector APT repository (signed-by)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ vector_apt_keyring }}] {{ vector_apt_repo_uri }} {{ vector_apt_repo_suite }} {{ vector_apt_repo_component }}"
    filename: vector
    state: present
    update_cache: true
  become: true

- name: Install Vector
  ansible.builtin.apt:
    name: "vector{{ ('=' + vector_version) if vector_version | length > 0 else '' }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Config dir is root-owned (vector only reads it); the DATA dir must be owned by
# the vector runtime user, which writes its state and disk buffers there —
# forcing it to root would break buffering.
- name: Ensure the Vector config and data directories exist with correct ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: vector
    mode: "0750"
  loop:
    - { path: "{{ vector_config_dir }}", owner: "root" }
    - { path: "{{ vector_data_dir }}", owner: "vector" }
  loop_control:
    label: "{{ item.path }}"
  become: true

# vector.yaml may carry a sink secret (token), so it is group-readable by the
# vector service user only. --config-yaml forces YAML parsing of the temp file
# (which lacks a .yaml suffix); --no-environment skips sink health checks so the
# validation is offline and side-effect-free.
- name: Deploy the Vector configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    owner: root
    group: vector
    mode: "0640"
    validate: "vector validate --no-environment --config-yaml %s"
  become: true
  # vector.yaml can embed a sink secret (HEC token, API key); diff:false keeps
  # the rendered secret out of `--diff`/CI output (site-common documents --diff
  # as a normal invocation).
  diff: false
  notify: Restart vector

- name: Enable and start Vector
  ansible.builtin.systemd_service:
    name: vector
    enabled: true
    state: started
  become: true
  when: vector_runtime_managed | bool
