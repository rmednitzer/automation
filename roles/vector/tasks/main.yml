---
# Vector: modern log shipper (journald -> SIEM). CTL-002 (evidence), CTL-003
# (centralised logging / forensic correlation).

- name: Assert a Vector sink is configured
  ansible.builtin.assert:
    that:
      - vector_sinks | length > 0
    fail_msg: >-
      vector_sinks must define at least one sink (where logs go) when the
      vector role is enabled — there is no safe default destination. See
      defaults/main.yml for examples; reference any secret via a vault var.
    quiet: true

# Only a container GUEST skips runtime management (the journald source needs the
# host journal and the unit may not run cleanly there); a container/LXC *host*
# runs Vector normally. The repo + config are applied regardless.
- name: Determine whether to manage the Vector runtime
  ansible.builtin.set_fact:
    vector_runtime_managed: >-
      {{ vector_manage_service | bool
         and not ((ansible_virtualization_type | default('')) in ['docker', 'podman', 'container', 'containerd', 'lxc', 'systemd-nspawn']
                  and (ansible_virtualization_role | default('host')) == 'guest') }}

- name: Ensure gnupg is present (for dearmoring the repo key)
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Fetch the Datadog/Vector repository signing keys (armored)
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "/usr/share/keyrings/vector-datadog-{{ item | basename }}.asc"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ vector_apt_key_urls }}"
  loop_control:
    label: "{{ item | basename }}"
  become: true

# Build the signed-by keyring from ONLY the current key files (not a glob, which
# could absorb a stale/unmanaged file) into a STAGING copy every run, so adding
# OR removing a key from vector_apt_key_urls is reflected. dearmor is a
# deterministic format conversion, so on a converged host the staging copy is
# byte-identical to the live keyring and nothing changes.
- name: Build the Datadog signing keyring (staging)
  ansible.builtin.shell:
    cmd: "set -o pipefail; cat {{ vector_key_files }} | gpg --batch --yes --dearmor -o {{ vector_apt_keyring }}.staging"
    executable: /bin/bash
  vars:
    vector_key_files: "{{ vector_apt_key_urls | map('basename') | map('regex_replace', '^', '/usr/share/keyrings/vector-datadog-') | map('regex_replace', '$', '.asc') | join(' ') }}"
  become: true
  changed_when: false

- name: Read the staging keyring fingerprints
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      gpg --show-keys --with-colons {{ vector_apt_keyring }}.staging
      | awk -F: '/^fpr:/ { print $10 }'
    executable: /bin/bash
  register: vector_staging_fprs
  changed_when: false
  become: true

# Optional supply-chain pin, asserted on the STAGING keyring BEFORE it is
# installed — so a failed pin never leaves an unexpected key in the live
# keyring. Honours the superseded singular var vector_apt_key_fingerprint (if an
# operator still sets it from the previous role API) so the rename does not
# silently drop a configured pin.
- name: Assert the staging keyring holds only pinned fingerprints
  ansible.builtin.assert:
    that:
      - (vector_staging_fprs.stdout_lines | map('upper') | list | reject('in', vector_effective_key_fingerprints | map('replace', ' ', '') | map('upper') | list) | list | length) == 0
    fail_msg: >-
      The Datadog keyring contains a fingerprint not in the pinned set
      ({{ vector_staging_fprs.stdout_lines }}). Refusing to trust the repository.
    quiet: true
  vars:
    vector_effective_key_fingerprints: >-
      {{ vector_apt_key_fingerprints if (vector_apt_key_fingerprints | length > 0)
         else ([vector_apt_key_fingerprint]
               if (vector_apt_key_fingerprint | default('') | length > 0) else []) }}
  when: vector_effective_key_fingerprints | length > 0

# Install the verified staging keyring atomically, ONLY when it differs from the
# live one (cmp rc != 0 also covers a missing live keyring). A removed key thus
# stops being trusted, and re-runs are no-ops.
- name: Detect whether the live keyring differs from the verified staging copy
  ansible.builtin.command:
    cmd: "cmp -s {{ vector_apt_keyring }} {{ vector_apt_keyring }}.staging"
  register: vector_keyring_cmp
  changed_when: false
  failed_when: false
  become: true

- name: Atomically install the verified keyring when it changed
  ansible.builtin.command:
    cmd: "mv -f {{ vector_apt_keyring }}.staging {{ vector_apt_keyring }}"
  become: true
  when: vector_keyring_cmp.rc != 0
  changed_when: true

- name: Remove the staging keyring when unchanged
  ansible.builtin.file:
    path: "{{ vector_apt_keyring }}.staging"
    state: absent
  become: true
  changed_when: false

- name: Ensure the apt keyring is world-readable
  ansible.builtin.file:
    path: "{{ vector_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure the Vector APT repository (signed-by)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ vector_apt_keyring }}] {{ vector_apt_repo_uri }} {{ vector_apt_repo_suite }} {{ vector_apt_repo_component }}"
    filename: vector
    state: present
    update_cache: true
  become: true

- name: Install Vector
  ansible.builtin.apt:
    name: "vector{{ ('=' + vector_version) if vector_version | length > 0 else '' }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Config dir is root-owned (vector only reads it); the DATA dir must be owned by
# the vector runtime user, which writes its state and disk buffers there —
# forcing it to root would break buffering.
- name: Ensure the Vector config and data directories exist with correct ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: vector
    mode: "0750"
  loop:
    - { path: "{{ vector_config_dir }}", owner: "root" }
    - { path: "{{ vector_data_dir }}", owner: "vector" }
  loop_control:
    label: "{{ item.path }}"
  become: true

# vector.yaml may carry a sink secret (token), so it is group-readable by the
# vector service user only. --config-yaml forces YAML parsing of the temp file
# (which lacks a .yaml suffix); --no-environment skips sink health checks so the
# validation is offline and side-effect-free.
- name: Deploy the Vector configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    owner: root
    group: vector
    mode: "0640"
    validate: "vector validate --no-environment --config-yaml %s"
  become: true
  # vector.yaml can embed a sink secret (HEC token, API key); diff:false keeps
  # the rendered secret out of `--diff`/CI output (site-common documents --diff
  # as a normal invocation).
  diff: false
  notify: Restart vector

- name: Enable and start Vector
  ansible.builtin.systemd_service:
    name: vector
    enabled: true
    state: started
  become: true
  when: vector_runtime_managed | bool
