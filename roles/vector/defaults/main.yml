---
# Vector log-shipping role defaults.
#
# Compliance references:
#   - CTL-002 — immutable evidence store: ships host logs (journald, audit,
#     auth) to the central SIEM/evidence store for retention.
#   - CTL-003 — logging legality, minimisation & forensic correlation:
#     centralised collection with TLS transport and timestamped correlation.
#   - POL-003 — cryptography policy: TLS for logs in transit.
#   - NIS2 Art 21.2(a)(b); GDPR Art 5(2) accountability, Art 32; ISO 27001:2022
#     A.8.15 logging, A.8.16 monitoring.
#
# Vector (vector.dev, by Datadog) is the modern log shipper: it reads journald
# and ships to a SIEM sink. It complements the rsyslog-based `log_forwarding`
# role (use one shipper or the other for a given log path). Targets Ubuntu
# 24.04 / 26.04 LTS (see docs/ADR-004).

# OFF by default: shipping needs a SIEM sink (endpoint, usually a secret token),
# which not every environment has. Enable per environment in group_vars once
# vector_sinks is defined. site-common.yml gates the role on this flag.
vector_enabled: false

# --- Package / supply chain ---------------------------------------------------
# Pin a version (e.g. "0.40.0-1"); empty = latest in the repo.
vector_version: ""
# Vector APT repo + Datadog signing key (signed-by keyring is the security
# anchor). See https://vector.dev/docs/setup/installation/package-managers/apt/
vector_apt_key_url: "https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public"
vector_apt_keyring: "/usr/share/keyrings/datadog-archive-keyring.gpg"
vector_apt_repo_uri: "https://apt.vector.dev/"
vector_apt_repo_suite: "stable"
vector_apt_repo_component: "vector-0"
# OPTIONAL supply-chain hardening: pin the Datadog APT key's full fingerprint
# (hex, no spaces). Empty by default (verified only when set). Obtain it
# out-of-band, e.g.:
#   curl -s https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public | gpg --show-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}'
vector_apt_key_fingerprint: ""

# --- Vector configuration -----------------------------------------------------
vector_config_dir: /etc/vector
vector_data_dir: /var/lib/vector

# Sources: what Vector reads. Default = the systemd journal (24.04/26.04). A
# dict of component-name -> Vector source config, rendered into vector.yaml.
vector_sources:
  journal:
    type: journald
    current_boot_only: false

# Transforms (optional): component-name -> Vector transform config.
vector_transforms: {}

# Sinks: WHERE logs go. EMPTY by default — there is no safe default destination,
# so the role asserts this is set when enabled (like log_forwarding's server).
# A dict of component-name -> Vector sink config. Reference secrets via a vault
# var, NOT a literal (public-repo-safe). Example (syslog over TLS to a SIEM):
#   vector_sinks:
#     siem:
#       type: socket
#       inputs: ["journal"]
#       mode: tcp
#       address: "siem.example.internal:6514"
#       encoding: { codec: "syslog" }
#       tls: { enabled: true, verify_certificate: true }
# Example (Splunk HEC; token from vault):
#   vector_sinks:
#     siem:
#       type: splunk_hec_logs
#       inputs: ["journal"]
#       endpoint: "https://splunk.example.internal:8088"
#       default_token: "{{ vault_vector_splunk_hec_token }}"
vector_sinks: {}

# --- Service ------------------------------------------------------------------
# Manage the vector service (enable + restart on config change). Auto-disabled
# in container GUESTS (the journald source needs the host journal and the unit
# may not run cleanly there); the repo + config are still applied. A
# container/LXC *host* is managed normally (ansible_virtualization_role check,
# as in the auditd / wazuh_agent roles).
vector_manage_service: true
