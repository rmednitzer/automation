---
# Password policy configuration
# NIS2 Art 21.2(i) — access control
# GDPR Art 32 — security of processing
# POL-001 — access control policy

- name: Install libpam-pwquality
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present
  become: true

- name: Configure password aging in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}"
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - key: PASS_MAX_DAYS
      value: "{{ users_password_max_days }}"
    - key: PASS_MIN_DAYS
      value: "{{ users_password_min_days }}"
    - key: PASS_WARN_AGE
      value: "{{ users_password_warn_days }}"
    - key: UMASK
      value: "{{ users_umask }}"
    - key: ENCRYPT_METHOD
      value: "{{ users_password_encrypt_method }}"
    - key: LOGIN_RETRIES
      value: "3"
    - key: LOGIN_TIMEOUT
      value: "{{ users_login_timeout }}"
    - key: LOG_OK_LOGINS
      value: "yes"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  become: true

- name: Configure password quality requirements
  ansible.builtin.template:
    src: pwquality.conf.j2
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: "0644"
  become: true

# Add password-history enforcement by adding remember= to the existing
# pam_unix entry rather than rewriting the whole line with a fragile
# regexp (which would drop hashing/option arguments and fight
# pam-auth-update).
- name: Enforce PAM password history (remember)
  community.general.pamd:
    name: common-password
    type: password
    control: "[success=1 default=ignore]"
    module_path: pam_unix.so
    module_arguments: "remember={{ users_password_remember }}"
    state: args_present
  become: true

- name: Configure PAM faillock thresholds
  ansible.builtin.template:
    src: faillock.conf.j2
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: users_faillock_enabled

# faillock.conf is inert unless pam_faillock is in the PAM stack. On Ubuntu
# 24.04 common-auth/common-account are GENERATED by pam-auth-update from
# profiles under /usr/share/pam-configs/. Editing those files directly with
# pamd anchors on exact pam_unix.so control strings, which a later
# pam-auth-update run can reorder or drop — silently mis-inserting or
# no-op'ing the faillock lines, with account lockout as the failure mode
# (H4). Instead, ship pam-config PROFILES and let pam-auth-update wire them
# in idempotently. This is the Debian-sanctioned mechanism and survives
# subsequent pam-auth-update invocations.
#
# Profile priorities are set relative to the Unix auth profile (pam_unix.so,
# priority 256): the preauth profile (faillock-notify) is 384 so it stacks
# ABOVE pam_unix and denies a locked account before the password is checked;
# the authfail/account profile (faillock) is 64 so it stacks BELOW pam_unix
# and counts a genuine password failure. Raising authfail above 256 would
# run it before pam_unix and mis-count failures.
# See roles/users/README.md "Account lockout (pam_faillock)" for the
# lockout-risk and break-glass recovery notes.
- name: Deploy pam_faillock pam-config profile (authfail + account)
  ansible.builtin.template:
    src: pam-config-faillock.j2
    dest: /usr/share/pam-configs/faillock
    owner: root
    group: root
    mode: "0644"
  become: true
  when: users_faillock_enabled

- name: Deploy pam_faillock-notify pam-config profile (preauth)
  ansible.builtin.template:
    src: pam-config-faillock-notify.j2
    dest: /usr/share/pam-configs/faillock-notify
    owner: root
    group: root
    mode: "0644"
  become: true
  when: users_faillock_enabled

# authsucc clears the failure tally on a successful login (Additional-type,
# priority 128 — appended after the primary preauth/pam_unix/authfail flow).
# Without it, non-consecutive typos accumulate and lock the account even
# after intervening successful logins (Codex review).
- name: Deploy pam_faillock authsucc pam-config profile (reset on success)
  ansible.builtin.template:
    src: pam-config-faillock-authsucc.j2
    dest: /usr/share/pam-configs/faillock-authsucc
    owner: root
    group: root
    mode: "0644"
  become: true
  when: users_faillock_enabled

# Snapshot the current stack so the enable step can report changed only when
# faillock was not already wired in (idempotent reporting).
- name: Check whether pam_faillock is already in common-auth
  ansible.builtin.command:
    cmd: grep -c pam_faillock.so /etc/pam.d/common-auth
  register: users_faillock_stack_before
  changed_when: false
  failed_when: false
  become: true
  when: users_faillock_enabled

- name: Enable faillock in the PAM stack via pam-auth-update
  ansible.builtin.command:
    cmd: pam-auth-update --package --enable faillock faillock-notify faillock-authsucc
  register: users_pam_auth_update
  changed_when: (users_faillock_stack_before.stdout | default('0') | int) == 0
  become: true
  when: users_faillock_enabled

# Verification: confirm pam_faillock actually landed in the generated stack.
# If pam-auth-update did not wire it in, fail loudly here rather than leaving
# faillock.conf inert (which would look enforced but silently is not).
- name: Read generated common-auth for verification
  ansible.builtin.command:
    cmd: grep -c pam_faillock.so /etc/pam.d/common-auth
  register: users_faillock_verify
  changed_when: false
  failed_when: false
  become: true
  when: users_faillock_enabled

- name: Assert pam_faillock is present in common-auth
  ansible.builtin.assert:
    that:
      - users_faillock_verify.stdout | int > 0
    fail_msg: >-
      pam_faillock is not present in /etc/pam.d/common-auth after
      pam-auth-update. faillock.conf would be inert (POL-001 lockout NOT
      enforced). Investigate the /usr/share/pam-configs/faillock profile and
      re-run `pam-auth-update --package --enable faillock faillock-notify`.
    success_msg: "pam_faillock is wired into common-auth (lockout enforced)."
  when: users_faillock_enabled
