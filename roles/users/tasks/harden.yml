---
# Account hardening tasks

# Ship umask + TMOUT via a single /etc/profile.d drop-in rather than editing
# /etc/profile and /etc/bash.bashrc in place (M6). The drop-in marks TMOUT
# readonly+exported so a user cannot `unset TMOUT` to defeat the idle-logout,
# and keeps the hardening in one Ansible-owned file that is trivially
# auditable and removable. CIS-aligned.
- name: Deploy shell session hardening profile (umask + TMOUT)
  ansible.builtin.template:
    src: 99-hardening.sh.j2
    dest: /etc/profile.d/99-hardening.sh
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Lock root account
  ansible.builtin.user:
    name: root
    password_lock: true
  become: true
  when: users_lock_root

- name: Disable unnecessary system accounts
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/sbin/nologin
  loop:
    - daemon
    - bin
    - sys
    - sync
    - games
    - man
    - lp
    - mail
    - news
    - uucp
    - proxy
    - www-data
    - backup
    - list
    - irc
    - gnats
    - nobody
  become: true
  when: users_disable_system_accounts
  failed_when: false
