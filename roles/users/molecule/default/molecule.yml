---
# Molecule scenario for the `users` role.
#
# Requires Docker. First executed live 2026-06-10 (LIMITATIONS L2 closure):
# full `molecule test` (converge + idempotence + verify) green on noble +
# resolute; gates in CI on push/PR. Run locally:
#
#   pip install molecule molecule-plugins[docker] docker
#   cd roles/users && molecule test
#
# `molecule test` runs the full sequence (create → converge → idempotence →
# verify → destroy); the idempotence step enforces a no-change second run.
#
# Dual-OS matrix (ADR-004): the role is exercised on BOTH Ubuntu 24.04
# (noble) and 26.04 (resolute, kernel 7.0) so the pam-auth-update /
# faillock wiring and login.defs / profile.d hardening are proven on each.
# converge.yml and verify.yml target hosts: all, so both boxes run them.

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  # systemd-enabled Ubuntu 24.04 image so pam-auth-update, login.defs, and
  # /etc/profile.d hardening behave as on a real host.
  - name: users-noble
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  # systemd-enabled Ubuntu 26.04 (Resolute Raccoon, kernel 7.0) image.
  # Published on Docker Hub as geerlingguy/docker-ubuntu2604-ansible.
  - name: users-resolute
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    # Resolve the role under test from the repo's roles/ tree. Surfaced by the
    # first live Docker run (LIMITATIONS L2): molecule no longer injects the
    # role's parent directory into the roles path, so include_role fails with
    # "role not found" without this.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      users-noble:
        # Deterministic, container-safe inputs for the converge.
        users_managed:
          - name: molecule-deploy
            groups:
              - sudo
            shell: /bin/bash
            state: present
      users-resolute:
        users_managed:
          - name: molecule-deploy
            groups:
              - sudo
            shell: /bin/bash
            state: present

verifier:
  name: ansible
