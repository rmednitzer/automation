---
# rkhunter role for Ubuntu 24.04/26.04 LTS
# NIS2 Art 21.2(a)(b), GDPR Art 32, ISO 27001 A.8.7

# rkhunter is a HOST rootkit scanner. Inside a container GUEST it only sees the
# container's namespaced view — host-kernel rootkits aren't assessable from
# inside and many checks false-positive — and rootkit scanning is the host's
# responsibility. Compute the guard once (same guest check as the auditd/
# log_forwarding roles): skip only when this host is a container *guest*; a
# container HOST (role 'host') is a real machine and must scan itself. The
# package, config, report dir, and logrotate are still deployed (config-as-
# code) — only the file-property baseline, the scheduled scan, and the post-apt
# re-baseline below are gated.
- name: Determine whether to manage the rkhunter runtime
  ansible.builtin.set_fact:
    rkhunter_runtime_managed: >-
      {{ not ((ansible_virtualization_type | default('')) in ['docker', 'podman', 'container', 'containerd', 'lxc', 'systemd-nspawn']
              and (ansible_virtualization_role | default('host')) == 'guest') }}

- name: Install rkhunter
  ansible.builtin.apt:
    name: rkhunter
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: rkhunter_enabled

- name: Deploy rkhunter configuration
  ansible.builtin.template:
    src: rkhunter.conf.j2
    dest: /etc/rkhunter.conf
    owner: root
    group: root
    mode: "0600"
    backup: true
  become: true
  when: rkhunter_enabled

- name: Ensure rkhunter report directory exists
  ansible.builtin.file:
    path: "{{ rkhunter_report_path | dirname }}"
    state: directory
    owner: root
    group: adm
    mode: "0750"
  become: true
  when: rkhunter_enabled

# `rkhunter --propupd` re-baselines the known-good file-property database.
# Running it on every converge silently absorbs any tampering into the
# baseline — the very risk this role cites to justify disabling the apt
# hook (M4b). Gate it to first install only via a marker file so the
# baseline is captured once (on a known-clean host) and not refreshed on
# every run. Re-baselining after a deliberate change is then an explicit
# operator action (remove the marker, or run propupd by hand).
- name: Check for rkhunter propupd baseline marker
  ansible.builtin.stat:
    path: /var/lib/rkhunter/.ansible-propupd-baseline
  register: rkhunter_propupd_marker
  become: true
  when:
    - rkhunter_enabled
    - rkhunter_update_db

- name: Update rkhunter file properties database (first install only)
  ansible.builtin.command:
    cmd: rkhunter --propupd
  become: true
  when:
    - rkhunter_enabled
    - rkhunter_update_db
    - not rkhunter_propupd_marker.stat.exists
    - rkhunter_runtime_managed
  changed_when: true

- name: Record rkhunter propupd baseline marker
  ansible.builtin.copy:
    dest: /var/lib/rkhunter/.ansible-propupd-baseline
    content: |
      # Ansible managed — marks that `rkhunter --propupd` has established the
      # file-property baseline once. Remove this file to allow a re-baseline
      # on the next converge (do so only on a known-clean host).
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - rkhunter_enabled
    - rkhunter_update_db
    - not rkhunter_propupd_marker.stat.exists
    - rkhunter_runtime_managed

- name: Deploy rkhunter cron job
  ansible.builtin.cron:
    name: "rkhunter daily scan"
    minute: "{{ rkhunter_cron_schedule.split(' ')[0] }}"
    hour: "{{ rkhunter_cron_schedule.split(' ')[1] }}"
    day: "{{ rkhunter_cron_schedule.split(' ')[2] }}"
    month: "{{ rkhunter_cron_schedule.split(' ')[3] }}"
    weekday: "{{ rkhunter_cron_schedule.split(' ')[4] }}"
    user: root
    job: >-
      /usr/bin/rkhunter --check --skip-keypress --quiet
      --logfile {{ rkhunter_report_path }}{% if rkhunter_mailto %}
      && if grep -q 'Warning' {{ rkhunter_report_path }};
      then mail -s 'rkhunter Warning {{ ansible_hostname }}'
      {{ rkhunter_mailto }} < {{ rkhunter_report_path }};
      fi{% endif %}
  become: true
  when:
    - rkhunter_enabled
    - rkhunter_cron_enabled
    - rkhunter_runtime_managed

- name: Deploy APT hook for rkhunter database update after upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/90rkhunter
    content: |
      // Ansible managed — update rkhunter DB after package operations
      DPkg::Post-Invoke { "if [ -x /usr/bin/rkhunter ]; then /usr/bin/rkhunter --propupd; fi"; };
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - rkhunter_enabled
    - rkhunter_apt_hook
    - rkhunter_runtime_managed

- name: Deploy rkhunter logrotate configuration
  ansible.builtin.copy:
    dest: /etc/logrotate.d/rkhunter
    content: |
      # Ansible managed
      {{ rkhunter_report_path }} {
          rotate 52
          weekly
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root adm
      }
    owner: root
    group: root
    mode: "0644"
  become: true
  when: rkhunter_enabled
