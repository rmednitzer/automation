---
# Fail2Ban role for Ubuntu 24.04 LTS

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Deploy fail2ban local configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Restart fail2ban

# Validate the rendered jail configuration before fail2ban (re)starts, so a
# bad jail/filter (e.g. ADR-001 F4.4 — invalid recidive backend) surfaces at
# deploy time rather than as a silently dead jail. fail2ban-client -t parses
# the full config and exits non-zero on any error.
- name: Validate fail2ban configuration
  ansible.builtin.command:
    cmd: fail2ban-client -t
  register: fail2ban_config_test
  changed_when: false
  failed_when: fail2ban_config_test.rc != 0
  become: true

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  become: true
