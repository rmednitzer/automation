---
# Fail2Ban role for Ubuntu 24.04/26.04 LTS

# fail2ban enforces bans through the host firewall (netfilter). Inside a
# container GUEST it has no NET_ADMIN over the host's netfilter, so starting
# the daemon (its jails install firewall rules on start) fails — the host owns
# perimeter banning. Compute the guard once (same guest check as the auditd/
# log_forwarding roles): skip only when this host is a container *guest*; a
# container HOST (role 'host') owns the real firewall and must manage it.
# fail2ban is still installed, the jail config deployed, and `fail2ban-client
# -t` still validates it (config-only) — only the daemon start/restart is gated.
- name: Determine whether to manage the fail2ban runtime
  ansible.builtin.set_fact:
    fail2ban_runtime_managed: >-
      {{ not ((ansible_virtualization_type | default('')) in ['docker', 'podman', 'container', 'containerd', 'lxc', 'systemd-nspawn']
              and (ansible_virtualization_role | default('host')) == 'guest') }}

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Deploy fail2ban local configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Restart fail2ban

# Validate the rendered jail configuration before fail2ban (re)starts, so a
# bad jail/filter (e.g. ADR-001 F4.4 — invalid recidive backend) surfaces at
# deploy time rather than as a silently dead jail. fail2ban-client -t parses
# the full config and exits non-zero on any error.
- name: Validate fail2ban configuration
  ansible.builtin.command:
    cmd: fail2ban-client -t
  register: fail2ban_config_test
  changed_when: false
  failed_when: fail2ban_config_test.rc != 0
  become: true

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  become: true
  # Skipped in container guests (fail2ban_runtime_managed): the daemon installs
  # netfilter rules on start, which need host NET_ADMIN. Install + jail config +
  # `-t` validation above still run, so a container converge exercises them.
  when: fail2ban_runtime_managed
