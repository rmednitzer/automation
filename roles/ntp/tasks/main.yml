---
# NTP role - Chrony time synchronization for Ubuntu 24.04/26.04 LTS

# The system clock is host-global. Inside a container GUEST chronyd cannot step
# the clock (no CAP_SYS_TIME) and starting/verifying the daemon fails or is
# meaningless — the host owns time sync. Compute the guard once, the same guest
# check the auditd/log_forwarding roles use: skip only when this host is a
# container *guest* (a container virtualization type AND role 'guest'); a
# container HOST (role 'host') still owns the real clock and must manage it.
# chrony is still installed and its config deployed (config-as-code) — only the
# runtime steps below are gated.
- name: Determine whether to manage the chrony runtime (ntp)
  ansible.builtin.set_fact:
    ntp_runtime_managed: >-
      {{ not ((ansible_virtualization_type | default('')) in ['docker', 'podman', 'container', 'containerd', 'lxc', 'systemd-nspawn']
              and (ansible_virtualization_role | default('host')) == 'guest') }}

- name: Remove systemd-timesyncd if present
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent
    purge: true
  become: true

- name: Install chrony and tzdata-legacy
  ansible.builtin.apt:
    name:
      # tzdata-legacy ships the right/ (leap-second-aware) zoneinfo tree on
      # Ubuntu 24.04 (Noble); without it chrony's `leapsectz right/UTC`
      # directive has no data and chronyd logs a failure. (L2)
      - chrony
      - tzdata-legacy
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    # ADR-001 F4.4: parse-check the rendered config before install. `-p`
    # makes chronyd print the configuration and exit without starting the
    # daemon, so a malformed directive fails the deploy instead of breaking
    # time sync (CTL-003 forensic-timestamp integrity).
    validate: "chronyd -p %s"
  become: true
  notify: Restart chrony

- name: Ensure chrony log directory exists
  ansible.builtin.file:
    path: "{{ ntp_logdir }}"
    state: directory
    owner: _chrony
    group: _chrony
    mode: "0750"
  become: true

- name: Enable and start chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true
  become: true
  # Skipped in container guests (ntp_runtime_managed): chronyd cannot own the
  # host clock there. chrony + its config are still installed/deployed above.
  when: ntp_runtime_managed

- name: Verify time synchronization status
  ansible.builtin.command:
    cmd: chronyc tracking
  register: ntp_tracking
  changed_when: false
  failed_when: false
  retries: 5
  delay: 3
  until: ntp_tracking.rc == 0
  become: true
  when: ntp_runtime_managed

- name: Display NTP sync status
  ansible.builtin.debug:
    msg: "{{ ntp_tracking.stdout_lines | default(['chrony not yet responding']) }}"
  when: ntp_runtime_managed
