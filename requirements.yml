---
# Ansible Galaxy dependencies.
#
# Install with:
#   ansible-galaxy install -r requirements.yml
#
# Versions are pinned exactly so the resolved set is deterministic and
# reproducible across local and CI runs (ADR-001 F4.2). Renovate's
# ansible-galaxy manager proposes minor and patch collection and role
# updates; review them against upstream release notes before merging.
#
# A CycloneDX SBOM of the resolved set is generated in CI by
# `scripts/galaxy-sbom.py` and attached as a workflow artifact for
# supply-chain evidence.

collections:
  - name: ansible.posix
    version: "2.2.0"
  - name: community.general
    version: "13.0.1"

roles: []
