---
# Pre-commit hooks for automation (Ansible).
#
# Install once:    pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
#
# CI mirrors this configuration via .github/workflows/ci.yml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        # Skip Jinja2 templates and any ansible-vault-encrypted files.
        exclude: ^(.*\.j2|.*vault.*\.ya?ml)$
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        files: \.(yaml|yml)$

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        exclude: ^(LICENSE|.*\.j2)$
