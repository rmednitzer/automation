---
# Pre-commit hooks for automation (Ansible).
#
# Install once:    pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
#
# CI mirrors this configuration via .github/workflows/ci.yml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        # Skip Jinja2 templates and any ansible-vault-encrypted files.
        exclude: ^(.*\.j2|.*vault.*\.ya?ml)$
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        files: \.(yaml|yml)$

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        exclude: ^(LICENSE|.*\.j2)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Guard the vault convention (H5): any file named `vault.yml` (the
  # encrypted-secrets filename per CLAUDE.md) must be ansible-vault
  # encrypted — i.e. start with the `$ANSIBLE_VAULT` header. `.example`
  # placeholders are excluded. This makes it impossible to silently commit
  # a plaintext secrets file.
  - repo: local
    hooks:
      - id: ansible-vault-encrypted
        name: ansible-vault encrypted vault.yml
        entry: scripts/check-vault-encrypted.sh
        language: script
        files: (^|/)vault\.yml$
