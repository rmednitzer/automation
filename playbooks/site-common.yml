---
# Site-wide common system management playbook
# Applies base configuration, security hardening, and compliance controls
# to all Ubuntu hosts.
#
# Compliance alignment:
#   - NIS2 Directive (EU 2022/2555) — Art 20, 21, 23
#   - GDPR (EU 2016/679) — Art 5, 25, 32, 33
#   - CRA (EU 2024/2847) — Annex I Part I, Part II
#   - Austrian NISG 2026 (NIS2 transposition, effective 2026-10-01)
#   - Austrian DSG (national GDPR supplement)
#   - ISO 27001:2022 Annex A controls
#   - Controls and policies: docs/compliance-controls.yml
#
# Usage:
#   ansible-playbook -i inventories/<env>/hosts playbooks/site-common.yml
#   ansible-playbook -i inventories/<env>/hosts playbooks/site-common.yml --tags ntp
#   ansible-playbook -i inventories/<env>/hosts playbooks/site-common.yml --tags firewall
#   ansible-playbook -i inventories/<env>/hosts playbooks/site-common.yml --tags compliance
#   ansible-playbook -i inventories/<env>/hosts playbooks/site-common.yml --check --diff
#
# Role execution order:
#   1. common          - Base packages, timezone, locale, sysctl, kernel/fs hardening
#   2. users           - User accounts, sudo, password policy
#   3. ntp             - Chrony time synchronization (before audit — timestamp integrity)
#   4. ssh_hardening   - SSH server hardening
#   5. ufw             - Firewall (after SSH to avoid lockout)
#   6. fail2ban        - Intrusion prevention (after firewall)
#   7. aide            - File integrity monitoring
#   8. rkhunter        - Rootkit detection
#   9. auditd          - Audit logging (installs auditd + audispd-plugins and
#                        creates /etc/audit/plugins.d — must precede
#                        log_forwarding, which drops audisp-remote configs there)
#  10. log_forwarding  - Centralised log collection (rsyslog + auditd → SIEM;
#                        depends on the auditd package and plugins.d directory)

- name: Apply common system management to all hosts
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Verify Ubuntu 24.04 LTS
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: "This playbook only supports Ubuntu 24.04 LTS. Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"
        quiet: true
      tags:
        - always

  roles:
    - role: common
      tags:
        - common
        - compliance
    # Mandatory Access Control (AppArmor LSM): ensure it is installed + active
    # and audit profile coverage early in the run. Safe-by-default — a profile
    # is only moved to complain/enforce mode when explicitly opted in.
    - role: apparmor
      tags:
        - apparmor
        - hardening
        - security
        - compliance
    # Kernel lockdown LSM: audit the current level (and, opt-in, set it via the
    # GRUB cmdline). Host-kernel layer beneath the MAC/service confinement.
    # Safe-by-default — audit-only until kernel_lockdown_level is set, and never
    # reboots (a cmdline change is flagged as reboot-required).
    - role: kernel_lockdown
      tags:
        - kernel-lockdown
        - hardening
        - security
        - compliance
    # USB device authorization (USBGuard, default-deny). Audit-only until
    # usbguard_enforce is set; even when enforcing, already-connected devices
    # are kept (no console lock-out) and only new insertions are filtered.
    - role: usbguard
      tags:
        - usbguard
        - hardening
        - security
        - compliance
    - role: users
      tags:
        - users
        - compliance
    - role: ntp
      tags:
        - ntp
        - compliance
    - role: dns
      tags:
        - dns
        - hardening
        - compliance
    - role: ssh_hardening
      tags:
        - ssh
        - hardening
        - compliance
    - role: ufw
      tags:
        - ufw
        - firewall
        - compliance
    # Default-deny egress (nftables, separate table — composes with ufw). The
    # network complement to ufw's ingress. Off by default; observe then enforce
    # per environment. Loop-back + established/related are always allowed, so
    # enforce can't strand the management session.
    - role: nftables_egress
      tags:
        - nftables-egress
        - firewall
        - hardening
        - security
        - compliance
    - role: fail2ban
      tags:
        - fail2ban
        - compliance
    - role: aide
      tags:
        - aide
        - fim
        - compliance
    - role: rkhunter
      tags:
        - rkhunter
        - rootkit
        - compliance
    - role: auditd
      tags:
        - auditd
        - audit
        - compliance
    - role: log_forwarding
      tags:
        - log-forwarding
        - logging
        - compliance
    # Modern log shipper (Vector: journald -> SIEM). Off unless an environment
    # sets vector_enabled and defines vector_sinks (a SIEM endpoint, usually a
    # vault secret), so the fleet-wide baseline run is unaffected by default.
    - role: vector
      when: vector_enabled | default(false)
      tags:
        - vector
        - logging
        - compliance
    # HIDS/FIM endpoint reporting to a Wazuh manager. Off unless an
    # environment sets wazuh_agent_enabled (requires a manager + enrolment
    # secret), so the fleet-wide baseline run is unaffected by default.
    - role: wazuh_agent
      when: wazuh_agent_enabled | default(false)
      tags:
        - wazuh
        - hids
        - security
        - compliance
    # Capstone hardening pass: per-service systemd sandboxing (drop-ins) plus a
    # read-only systemd-analyze security audit. Runs last so the audit sees
    # every service installed above. Safe-by-default — audit-only until a unit
    # is opted into systemd_hardening_units, so the baseline run is unaffected.
    - role: systemd_hardening
      tags:
        - systemd-hardening
        - hardening
        - security
        - compliance
