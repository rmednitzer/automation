---
# Standalone playbook for installing the SRE/Platform/Security toolchain
# on operator hosts (workstations, admin/bastion VMs, CI runners). This
# is intentionally separate from site-common.yml — the hardening baseline
# applies to all fleet hosts, while this toolchain targets only the hosts
# that need to operate Kubernetes/security workloads.
#
# Compliance alignment:
#   - NIS2 Art 21.2(a)(e) — risk management, vulnerability handling
#   - CRA Annex I Part I  — secure-by-default downloads (checksum-verified by
#                           default; strict policy refuses unverified assets)
#   - ISO 27001:2022 A.8.30 — supplier-relationship security
#   - POL-002, CTL-002    — see roles/sre_toolchain/README.md and
#                           docs/ADR-002-sre-toolchain-supply-chain.md
#
# Checksum verification is strict by default (a tool with no published
# checksum is refused). Opt out with -e sre_toolchain_checksum_policy=best-effort.
#
# Usage:
#   ansible-playbook -i inventories/<env>/hosts playbooks/sre-toolchain.yml
#   ansible-playbook -i inventories/<env>/hosts playbooks/sre-toolchain.yml \
#     -e sre_toolchain_github_token="$GITHUB_TOKEN" \
#     -e sre_toolchain_verify_signatures=true
#
# Inventory:
#   Target a group such as `operators` or `workstations`. Override
#   `hosts:` below or override the limit on the CLI (-l <host>).

- name: Install SRE/Platform/Security toolchain on operator hosts
  hosts: operators
  gather_facts: true

  pre_tasks:
    - name: Verify a supported Ubuntu LTS (24.04 or 26.04)
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version in ["24.04", "26.04"]
        fail_msg: >-
          This playbook supports Ubuntu 24.04 / 26.04 LTS. Detected:
          {{ ansible_distribution }} {{ ansible_distribution_version }}
        quiet: true
      tags:
        - always

  roles:
    - role: sre_toolchain
      tags:
        - sre-toolchain
